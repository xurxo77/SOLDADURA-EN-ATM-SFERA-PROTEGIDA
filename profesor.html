<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aula-taller de soldadura · Xurxo</title>
<meta name="theme-color" content="#16314F">
<script src="acceso.js"></script>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="aula.css">
<style>
body{--c:var(--violet)}
.resumen{font-size:.92rem;color:var(--ink2)}
.mods-ut{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.atajos{margin-top:44px;padding-top:6px;border-top:1px solid var(--line);display:grid;gap:0}
.atajos a{display:flex;align-items:center;gap:4px 12px;flex-wrap:wrap;text-decoration:none;color:inherit;border-bottom:1px solid var(--line);padding:10px 2px;min-height:3rem}
.atajos b{color:var(--violet)}
.atajos b{flex:1}
.atajos i{font-style:normal;color:var(--violet);font-weight:700;font-size:1.3rem}
a.tarj .cifra{color:var(--ink2);font-weight:700;margin-top:6px;font-size:.95rem}
/* Classroom */
.btn.cr{--c:var(--cr)}
.consejo{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--cr-soft);border-left:5px solid var(--cr);border-radius:10px;padding:12px 14px;margin-top:14px}
.consejo p{flex:1;min-width:14rem;font-size:.95rem}
.consejo b{color:var(--cr)}
.ut-card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:10px 12px}
.ut-card .ut{border:0;padding:0;min-height:0;background:transparent}
.ut-card details{margin-top:8px;border-top:1px dashed var(--line);padding-top:4px}
.ut-card summary{cursor:pointer;color:var(--ink2);font-size:.9rem;min-height:2.4rem;display:flex;align-items:center}
.ut-card ol{list-style:none;padding:0;margin:4px 0 0;display:grid;gap:6px}
.ut-card li{display:flex;align-items:center;gap:8px;font-size:.95rem}
.ut-card li span{flex:1}
.ut-card li .btn{min-height:2.3rem;padding:.25rem .6rem;font-size:.88rem}
details.otras{margin-top:16px}
details.otras>summary{cursor:pointer;font-weight:700;color:var(--violet);min-height:2.4rem;display:flex;align-items:center}
.enlace{background:var(--arc-soft);border-radius:12px;padding:12px 14px;margin-top:14px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.enlace code{font-size:.9rem;word-break:break-all;flex:1;min-width:12rem}
.enlace .btn{--c:var(--arc)}
.enlace .btn.cr{--c:var(--cr)}
.ciclos{display:grid;gap:10px;margin-top:18px}
</style>
<script src="banco.js"></script>
<script src="aula-datos.js"></script>
<script src="classroom-config.js"></script>
<script src="classroom.js"></script>
</head>
<body>
<header class="top"><div class="in">
  <div class="etq">Espacio docente</div>
  <h1>Aula-taller de soldadura</h1>
</div></header>

<main id="vista"></main>

<dialog id="crDlg" aria-labelledby="crTit"><div class="cr-in"><div class="cr-cab"><h2 id="crTit">Montar en Classroom</h2><button type="button" class="cr-x" id="crCerrar" aria-label="Cerrar">✕</button></div><div id="crCuerpo"></div></div></dialog>
<nav class="barra" aria-label="Navegación">
  <a class="atras" id="bAtras" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Atrás</a>
  <a id="bInicio" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Inicio</a>
</nav>
<footer>Material elaborado por <b>Xurxo</b><span id="salirClave" hidden> · <a href="#" onclick="ACCESO_SALIR();return false">Cerrar el acceso en este navegador</a></span></footer>
<script>if(window.ACCESO_HUELLA)document.getElementById("salirClave").hidden=false</script>

<script>
(function(){
  // La planificación (qué ve cada clase, orden, publicar u ocultar) se hace en Google Classroom.
  // Esta página es la biblioteca: muestra las unidades de cada módulo y las lleva a Classroom.
  var B=window.BANCO,A=window.AULA;
  var $=function(s){return document.querySelector(s)};
  // Barra de abajo (móvil): Atrás sube un nivel; Inicio va al principio de este espacio
  function barra(atras,inicio){var a=document.getElementById("bAtras"),i=document.getElementById("bInicio");a.href=atras||"#";a.classList.toggle("off",!atras);i.href=inicio||"#";i.classList.toggle("off",!inicio);a.parentNode.hidden=!atras&&!inicio;document.body.classList.toggle("sin-barra",!atras&&!inicio)}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  var POS={migmag:"50% 40%",corte:"30% 50%",trazado:"50% 20%"};

  var CLASE={},MOD={},CICLO={};
  A.ciclos.forEach(function(ci){CICLO[ci.id]=ci;ci.cursos.forEach(function(cu){
    cu.ciclo=ci.corto+" "+ci.nombre;cu.ci=ci;CLASE[cu.id]=cu;
    cu.modulos.forEach(function(m){MOD[m[0]]=MOD[m[0]]||{cod:m[0],nombre:m[1],color:m[2]}});
  })});
  Object.keys(B.modulos).forEach(function(c){if(!MOD[c])MOD[c]={cod:c,nombre:B.modulos[c].nombre,color:"#4A5F78"}});

  function utsDe(c){return B.temas.filter(function(t){return t.modulos.indexOf(c)>=0})}
  function img(t){return '<img src="img/'+t.id+'.jpg" alt="" loading="lazy"'+(POS[t.id]?' style="object-position:'+POS[t.id]+'"':'')+'>'}
  function abs(ruta){return new URL(ruta,location.href).href}
  // Botón «Compartir en Classroom»: abre Classroom con el enlace y el título ya puestos (no necesita claves)
  function classroom(ruta,tit){return "https://classroom.google.com/share?url="+encodeURIComponent(abs(ruta))+"&title="+encodeURIComponent(tit)}
  function btnCR(ruta,tit,txt){return '<a class="btn cr'+(txt?' lleno':'')+'" href="'+classroom(ruta,tit)+'" target="_blank" rel="noopener" title="Compartir en Google Classroom">'+(txt||'Classroom')+'</a>'}
  function migas(arr){return '<nav class="migas" aria-label="Dónde estás">'+arr.map(function(x,i){return i<arr.length-1?'<a href="'+x[1]+'">'+esc(x[0])+'</a><span class="sep">›</span>':'<span>'+esc(x[0])+'</span>'}).join("")+'</nav>'}
  function titulo(t){$("header h1").textContent=t}
  // Línea pequeña encima del título: dice lo que el título no dice (ciclo, código del módulo)
  function etq(html){$("header .etq").innerHTML=html||"Espacio docente · De Xurxo para el mundo"}
  function curso(n){document.body.className=n?"curso-"+n:""}
  function franja(cu){return '<div class="franja curso-'+cu.n+'"><span class="sello">'+cu.n+'.º</span><div><b>'+esc(cu.nombre)+'</b><span>'+esc(cu.ciclo)+'</span></div></div>'}
  function migaCiclo(ci){return [ci.corto+" "+ci.nombre,"#ci="+ci.id]}
  function unidadesCurso(cu){var u={};cu.modulos.forEach(function(m){utsDe(m[0]).forEach(function(t){u[t.id]=1})});return Object.keys(u).length}

  // ---------- Pantallas ----------
  // 1. Inicio: los ciclos, uno por fila. La sigla (CFGM, CFGS, FPB) ya dice el grado.
  function inicio(){
    titulo("Aula-taller de soldadura");
    var activos=A.ciclos.filter(function(ci){return ci.cursos.length}),prox=A.ciclos.filter(function(ci){return !ci.cursos.length});
    var h='<div class="ciclos">';
    activos.forEach(function(ci){
      var n=0;ci.cursos.forEach(function(cu){n+=unidadesCurso(cu)});
      h+='<a class="fila-ciclo" style="--k:'+ci.color+'" href="#ci='+ci.id+'"><span class="sigla">'+esc(ci.corto)+'</span><span class="tx"><b>'+esc(ci.nombre)+'</b><small>'+ci.cursos.length+' cursos · '+n+' unidades</small></span><i aria-hidden="true">›</i></a>';
    });
    prox.forEach(function(ci){
      h+='<div class="fila-ciclo prox" style="--k:'+ci.color+'"><span class="sigla">'+esc(ci.corto)+'</span><span class="tx"><b>'+esc(ci.nombre)+'</b><small>Próximamente</small></span></div>';
    });
    h+='</div><nav class="atajos" aria-label="Más herramientas">'+
      '<a href="#catalogo"><b>Catálogo de unidades</b><i aria-hidden="true">›</i></a>'+
      '<a href="preparar.html"><b>Preparar una prueba</b><i aria-hidden="true">›</i></a></nav>';
    return h;
  }

  // 2. Ciclo: los cursos
  function ciclo(ci){
    titulo(ci.corto+" "+ci.nombre);
    var h=migas([["Inicio","#"],[ci.corto+" "+ci.nombre]])+'<div class="lista" style="margin-top:14px">';
    ci.cursos.forEach(function(cu){
      h+='<a class="tarj curso curso-'+cu.n+'" href="#c='+cu.id+'"><span class="sello">'+cu.n+'.º</span><div><h3>'+esc(cu.nombre)+'</h3><p>'+cu.modulos.length+' módulos</p><p class="cifra">'+unidadesCurso(cu)+' unidades de trabajo</p></div></a>';
    });
    return h+'</div>';
  }

  // 3. Curso: sus módulos y el enlace de la clase
  function clase(id){
    var cu=CLASE[id];titulo(cu.nombre);curso(cu.n);etq(esc(cu.ciclo));
    var h=migas([["Inicio","#"],migaCiclo(cu.ci),[cu.nombre]])+'<div class="rejilla" style="margin-top:14px">';
    cu.modulos.forEach(function(m){
      var l=utsDe(m[0]);
      h+='<a class="tarj modulo'+(l.length?'':' vacia')+'" style="--mc:'+m[2]+'" href="#c='+id+'&m='+m[0]+'"><span class="codm">'+m[0]+'</span><h3>'+esc(m[1])+'</h3><p>'+
        (l.length?l.length+(l.length===1?' unidad: ':' unidades: ')+esc(l.map(function(t){return t.nombre}).join(" · ")):'Todavía no hay unidades')+'</p></a>';
    });
    var ruta="clase.html?c="+id;
    h+='</div><div class="enlace"><span><b>Apuntes de toda la clase</b>:</span><code id="url">'+esc(abs(ruta))+'</code>'+
      '<button type="button" class="btn" id="copiar">Copiar</button>'+btnCR(ruta,"Apuntes · "+cu.grupo,"Compartir en Classroom")+'</div>'+
      '<p class="nota">Ponlo fijo en Classroom (por ejemplo, en el tablón): el alumnado tendrá a mano todos los apuntes de su curso.</p>';
    return h;
  }

  // 4. Módulo: sus unidades, cada una lista para llevar a Classroom
  function tarjetaUT(t){
    return '<div class="ut-card c-'+t.id+'"><div class="ut">'+img(t)+'<div class="tx"><h3>'+esc(t.nombre)+'</h3><p>'+t.bloques.length+' bloques</p></div>'+
      '<div class="acc">'+btnCR(t.web,"UT · "+t.nombre,"Compartir en Classroom")+'<a class="btn gris" href="'+t.web+'" target="_blank" rel="noopener">Ver</a></div></div>'+
      '<details><summary>Compartir un bloque suelto</summary><ol>'+t.bloques.map(function(b){
        var r=t.web+"#"+b.pag;
        return '<li><span>'+b.n+'. '+esc(b.nombre)+'</span>'+btnCR(r,t.nombre+" · Bloque "+b.n+": "+b.nombre)+'<a class="btn gris" href="'+r+'" target="_blank" rel="noopener">Ver</a></li>';
      }).join("")+'</ol></details></div>';
  }
  function modulo(id,c){
    var cu=CLASE[id],m=MOD[c],l=utsDe(c);titulo(m.nombre);curso(cu.n);
    var h=migas([["Inicio","#"],migaCiclo(cu.ci),[cu.nombre,"#c="+id],[m.nombre]]);
    etq('<span class="codm" style="--mc:'+m.color+'">'+c+'</span>'+esc(cu.nombre+" · "+cu.ciclo));
    h+='<div class="consejo"><p><b>Montar en Classroom</b> crea en tu clase el tema «'+esc(c+" "+m.nombre)+'» con todas sus unidades, en borrador. Después publicas allí lo que toque.</p>'+
      '<button type="button" class="btn cr lleno" id="montar">Montar en Classroom</button></div>';
    h+=l.length?'<div class="lista" style="margin-top:14px">'+l.map(tarjetaUT).join("")+'</div>':'<p class="vacio">Este módulo todavía no tiene unidades.</p>';
    var otras=B.temas.filter(function(t){return t.modulos.indexOf(c)<0});
    if(otras.length)h+='<details class="otras"><summary>Unidades de otros módulos ('+otras.length+')</summary><p class="resumen">Por si una unidad te sirve también aquí (por ejemplo, seguridad).</p><div class="lista" style="margin-top:8px">'+otras.map(tarjetaUT).join("")+'</div></details>';
    return h;
  }

  // Catálogo general
  function catalogo(){
    titulo("Catálogo de unidades");
    var h=migas([["Inicio","#"],["Catálogo de unidades"]])+'<div class="lista" style="margin-top:14px">';
    B.temas.forEach(function(t){
      h+='<div class="ut-card c-'+t.id+'"><div class="ut">'+img(t)+'<div class="tx"><h3>'+esc(t.nombre)+'</h3><p>'+t.bloques.length+' bloques: '+esc(t.bloques.map(function(b){return b.nombre}).join(" · "))+'</p>'+
        '<div class="mods-ut">'+t.modulos.map(function(c){var m=MOD[c];return '<span class="codm" style="--mc:'+(m?m.color:"#4A5F78")+'" title="'+esc(m?m.nombre:"")+'">'+c+' '+esc(m?m.nombre:"")+'</span>'}).join("")+'</div></div>'+
        '<div class="acc">'+btnCR(t.web,"UT · "+t.nombre)+'<a class="btn gris" href="'+t.web+'" target="_blank" rel="noopener">Ver</a></div></div></div>';
    });
    return h+'</div>';
  }

  // ---------- Ruta ----------
  function params(){var o={};location.hash.slice(1).split("&").forEach(function(p){var kv=p.split("=");if(kv[0])o[kv[0]]=decodeURIComponent(kv[1]||"")});return o}
  function pinta(){
    var p=params(),h;curso(0);etq();
    if(p.catalogo!==undefined){h=catalogo();barra("#top","#top")}
    else if(p.ci&&CICLO[p.ci]&&CICLO[p.ci].cursos.length){h=ciclo(CICLO[p.ci]);barra("#top","#top")}
    else if(p.c&&CLASE[p.c]&&p.m&&MOD[p.m]){h=modulo(p.c,p.m);barra("#c="+p.c,"#top")}
    else if(p.c&&CLASE[p.c]){h=clase(p.c);barra("#ci="+CLASE[p.c].ci.id,"#top")}
    else{h=inicio();barra(null,null)}
    $("#vista").innerHTML=h;
    var t1=$("header h1").textContent;document.title=t1==="Aula-taller de soldadura"?t1+" · Xurxo":t1+" · Aula-taller";
    window.scrollTo(0,0);
  }
  // ---------- Montar un módulo en Classroom (API) ----------
  // Crea (o reutiliza) el tema del módulo y un material en borrador por unidad, con el enlace de la unidad
  // y de cada bloque. Se crean del último al primero para que en Classroom salgan en orden (lo nuevo va arriba).
  var M=null;
  var dlg=$("#crDlg"),cuerpo=$("#crCuerpo");
  function abreMontar(id,c){M={id:id,c:c,clases:null,curso:null,uts:{},paso:"",log:[],error:"",hecho:false};utsDe(c).forEach(function(t){M.uts[t.id]=true});dlg.showModal();pintaM()}
  function nomClase(k){return k.name+(k.section?" · "+k.section:"")}
  function lista(){return '<ul class="cr-log">'+M.log.map(function(x){return '<li>'+x+'</li>'}).join("")+'</ul>'}
  function pintaM(){
    var m=MOD[M.c],h="";
    if(!CR.configurado()){
      h='<p>Para crear temas y materiales en tu Classroom desde aquí, hay que conectar la web con Google <b>una sola vez</b>: crear un proyecto gratuito en Google Cloud y pegar su «ID de cliente» en <code>classroom-config.js</code>.</p>'+
        '<p class="resumen">Los pasos están en la guía <b>GUIA_API_CLASSROOM.md</b>. Mientras tanto, usa «Compartir en Classroom» en cada unidad.</p>';
    }else if(M.error){
      h=(M.log.length?lista():'')+'<p class="cr-error">'+esc(M.error)+'</p><button type="button" class="btn cr lleno" data-m="reintentar">Volver a probar</button>';
    }else if(!CR.conectado()){
      h='<p>Entra con la cuenta de Google de tu Classroom. Google te preguntará si dejas a esta web <b>ver tus clases y crear temas y materiales</b>.</p>'+
        '<button type="button" class="btn cr lleno" data-m="entrar">Entrar con Google</button>';
    }else if(!M.clases){
      h='<p class="resumen">Buscando tus clases de Classroom…</p>';
      CR.clases().then(function(l){
        M.clases=l;var g=null;try{g=localStorage.getItem("cr_clase_"+M.id)}catch(e){}
        M.curso=(l.filter(function(k){return k.id===g})[0]||l[0]||{}).id||null;pintaM();
      },function(e){M.error=e.message;pintaM()});
    }else if(M.hecho){
      var k=M.clases.filter(function(x){return x.id===M.curso})[0];
      h=lista()+'<p><b>Listo.</b> Todo queda en <b>borrador</b>: entra en Classroom, revisa el tema y publica lo que toque.</p>'+
        (k&&k.alternateLink?'<a class="btn cr lleno" href="'+esc(k.alternateLink)+'" target="_blank" rel="noopener">Abrir la clase en Classroom</a>':'');
    }else if(M.paso==="creando"){
      h=lista()+'<p class="resumen">Creando en Classroom…</p>';
    }else if(!M.clases.length){
      h='<p>No tienes clases activas en Classroom con esta cuenta. Crea la clase en Classroom y vuelve a probar.</p>';
    }else{
      var l=utsDe(M.c);
      h='<label class="cr-lab" for="crClase">Clase de Classroom</label><select id="crClase">'+M.clases.map(function(k){return '<option value="'+esc(k.id)+'"'+(k.id===M.curso?' selected':'')+'>'+esc(nomClase(k))+'</option>'}).join("")+'</select>'+
        '<p class="cr-lab">Unidades</p><div class="cr-uts">'+l.map(function(t){return '<label class="chk"><input type="checkbox" data-ut="'+t.id+'"'+(M.uts[t.id]?' checked':'')+'> <span>'+esc(t.nombre)+' <small>('+t.bloques.length+' bloques)</small></span></label>'}).join("")+'</div>'+
        '<p class="resumen">Se crea el tema <b>«'+esc(M.c+" "+m.nombre)+'»</b> (o se usa si ya existe) con un material por unidad, <b>en borrador</b>. Lo que ya esté en ese tema no se repite.</p>'+
        (/^(localhost|127\.)/.test(location.hostname)?'<p class="cr-aviso">Estás en tu ordenador: los enlaces apuntarán a <code>'+esc(location.host)+'</code> y el alumnado no podrá abrirlos. Para la clase de verdad, hazlo desde la web de GitHub.</p>':'')+
        '<button type="button" class="btn cr lleno" data-m="crear">Crear en Classroom</button>';
    }
    cuerpo.innerHTML=h;
  }
  function crear(){
    var curso=M.curso,m=MOD[M.c],nombre=M.c+" "+m.nombre;
    var elegidas=utsDe(M.c).filter(function(t){return M.uts[t.id]});
    if(!elegidas.length){M.error="Marca al menos una unidad.";pintaM();return}
    try{localStorage.setItem("cr_clase_"+M.id,curso)}catch(e){}
    M.paso="creando";M.log=[];pintaM();
    var temaId,ya={};
    function apunta(x){M.log.push(x);pintaM()}
    CR.temas(curso).then(function(ts){
      var t=ts.filter(function(x){return x.name===nombre})[0];
      if(t){temaId=t.topicId;apunta("✓ Tema «"+esc(nombre)+"» (ya existía)");return}
      return CR.crearTema(curso,nombre).then(function(n){temaId=n.topicId;apunta("✓ Tema «"+esc(nombre)+"» creado")});
    }).then(function(){return CR.materiales(curso)}).then(function(ms){
      ms.forEach(function(x){if(x.topicId===temaId)ya[x.title]=1});
      return elegidas.slice().reverse().reduce(function(pr,t){
        return pr.then(function(){
          var tit="UT · "+t.nombre;
          if(ya[tit]){apunta("· "+esc(t.nombre)+": ya estaba, no se repite");return}
          var desc="Apuntes de la unidad de trabajo «"+t.nombre+"», con dibujos y un test al final de cada bloque.\n\nBloques:\n"+
            t.bloques.map(function(b){return b.n+". "+b.nombre}).join("\n");
          var enl=[abs(t.web)].concat(t.bloques.map(function(b){return abs(t.web+"#"+b.pag)}));
          return CR.crearMaterial(curso,temaId,tit,desc,enl).then(function(){apunta("✓ "+esc(t.nombre)+" (borrador)")});
        });
      },Promise.resolve());
    }).then(function(){M.hecho=true;M.paso="";pintaM()},function(e){M.paso="";M.error=e.message;pintaM()});
  }
  cuerpo.addEventListener("click",function(e){
    var b=e.target.closest("[data-m]");if(!b)return;
    var a=b.getAttribute("data-m");
    if(a==="entrar"){b.disabled=true;b.textContent="Abriendo Google…";CR.conectar().then(pintaM,function(err){M.error=err.message;pintaM()})}
    else if(a==="reintentar"){M.error="";M.log=[];if(!CR.conectado())M.clases=null;pintaM()}
    else if(a==="crear")crear();
  });
  cuerpo.addEventListener("change",function(e){
    if(e.target.id==="crClase")M.curso=e.target.value;
    var u=e.target.getAttribute("data-ut");if(u)M.uts[u]=e.target.checked;
  });
  $("#crCerrar").addEventListener("click",function(){dlg.close()});
  $("#vista").addEventListener("click",function(e){if(e.target.closest("#montar")){var p=params();abreMontar(p.c,p.m)}});

  window.addEventListener("hashchange",pinta);
  $("#vista").addEventListener("click",function(e){
    var b=e.target.closest("#copiar");if(!b)return;
    var u=$("#url").textContent;
    (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(function(){b.textContent="¡Copiado!"},function(){
      var r=document.createRange();r.selectNodeContents($("#url"));var s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="Seleccionado: cópialo";
    });
  });
  pinta();
})();
</script>
