[aria-pressed=\"true\"]{background:var(--molten);border-color:var(--molten);color:#fff}\n.hero .volver{color:#fff;text-decoration:none;font-weight:700}\n.calc .kline{margin:0 0 .2rem;font-size:1rem;line-height:1.5}\n.calc .kcap{margin:.7rem 0 0;font-weight:700;font-size:.9rem}\n.calc .out svg{display:block;width:100%;height:auto}\n.volverc{display:inline-flex;align-items:center;gap:.3rem;font:inherit;font-weight:700;color:var(--arc);background:none;border:0;padding:.4rem 0;margin:0 0 .3rem;cursor:pointer;min-height:2.4rem}\n.volverc:hover{text-decoration:underline}\n.tabhome{flex:.8;max-width:6rem;display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.3rem .15rem;border-radius:10px;text-decoration:none;color:var(--ink2);min-height:3.3rem;border-right:1px solid var(--line);margin-right:.15rem}\n.tabhome .n{width:1.65rem;height:1.65rem;border-radius:50%;display:grid;place-items:center;background:none;border:1.5px solid var(--ink2);font-size:1rem;line-height:1}\n.tabhome .t{font-size:.8rem;font-weight:700}\n.tabhome:hover{background:var(--paper)}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader class=\"topnav\" id=\"topnav\">\n  \u003cdiv class=\"bar\" id=\"bar\">\u003c/div>\n  \u003cnav class=\"tabbar\" id=\"tabbar\" aria-label=\"Pantallas\">\n    \u003ca class=\"tabhome\" href=\"TRAZ_0_Portada.html\" aria-label=\"Volver a la portada: los 5 bloques\">\u003cspan class=\"n\">⌂\u003c/span>\u003cspan class=\"t\">Bloques\u003c/span>\u003c/a>\n    \u003cbutton type=\"button\" data-s=\"inicio\">\u003cspan class=\"n\">1\u003c/span>\u003cspan class=\"t\">Piezas\u003c/span>\u003c/button>\n    \u003cbutton type=\"button\" data-s=\"paso\">\u003cspan class=\"n\">2\u003c/span>\u003cspan class=\"t\">Dibújalo\u003c/span>\u003c/button>\n    \u003cbutton type=\"button\" data-s=\"entender\">\u003cspan class=\"n\">3\u003c/span>\u003cspan class=\"t\">Entiéndelo\u003c/span>\u003c/button>\n    \u003cbutton type=\"button\" data-s=\"comprueba\">\u003cspan class=\"n\">4\u003c/span>\u003cspan class=\"t\">Comprueba\u003c/span>\u003c/button>\n    \u003cbutton type=\"button\" data-s=\"ideas\">\u003cspan class=\"n\">5\u003c/span>\u003cspan class=\"t\">Test\u003c/span>\u003c/button>\n  \u003c/nav>\n\u003c/header>\n\n\u003cdiv class=\"hero\" id=\"top\">\n  \u003csvg class=\"bg\" id=\"heroSvg\" viewBox=\"0 0 800 420\" preserveAspectRatio=\"xMidYMid slice\" aria-hidden=\"true\">\u003c/svg>\n  \u003cdiv class=\"txt wrap\">\n    \u003cp class=\"ctx\">\u003ca href=\"TRAZ_0_Portada.html\" class=\"volver\">← Trazado de desarrollos\u003c/a> · Bloque 3 de 5\u003c/p>\n    \u003ch1>Conos\u003c/h1>\n    \u003cp class=\"ctx\">Método de radiación, desde el vértice · Módulo 0091 · \u003cb>Autor: Xurxo\u003c/b>\u003c/p>\n  \u003c/div>\n\u003c/div>\n\n\n\u003cmain class=\"wrap\">\n\n\u003c!-- ============ 1 · LAS PIEZAS ============ -->\n\u003csection id=\"inicio\" class=\"scr start\">\n  \u003cp class=\"lead\">Embudos, tolvas cónicas y reducciones. Todos salen de un \u003cb>cono\u003c/b>: se busca su \u003cb>vértice\u003c/b> y desde él se trazan los arcos con el compás.\u003c/p>\n  \u003cdiv class=\"dcards\">\n    \u003cbutton type=\"button\" class=\"dcard\" data-des=\"0\">\u003csvg class=\"td\" id=\"iso0\" viewBox=\"0 0 10 10\" aria-hidden=\"true\">\u003c/svg>\u003cb>Tronco de cono recto\u003c/b>\u003cspan>Ø100 abajo · Ø50 arriba · 60 de alto\u003c/span>\u003c/button>\n    \u003cbutton type=\"button\" class=\"dcard\" data-des=\"1\">\u003csvg class=\"td\" id=\"iso1\" viewBox=\"0 0 10 10\" aria-hidden=\"true\">\u003c/svg>\u003cb>Cono cortado oblicuo\u003c/b>\u003cspan>Ø100 · boca inclinada\u003c/span>\u003c/button>\n  \u003c/div>\n  \u003cp class=\"muted small\" style=\"text-align:center\">Toca una pieza para dibujarla. En naranja, la plantilla que vas a trazar.\u003c/p>\n  \u003cdetails class=\"mas\">\u003csummary>Qué vas a aprender\u003c/summary>\u003cdiv class=\"in\">\n    \u003cul class=\"list\">\n      \u003cli>encontrar el \u003cb>vértice\u003c/b> del cono prolongando sus lados;\u003c/li>\n      \u003cli>trazar la plantilla con \u003cb>dos arcos\u003c/b> desde el vértice;\u003c/li>\n      \u003cli>llevar el \u003cb>paso de la base\u003c/b> 12 veces con el compás;\u003c/li>\n      \u003cli>sacar la \u003cb>medida real\u003c/b> de cada generatriz cuando el cono está cortado.\u003c/li>\n    \u003c/ul>\n  \u003c/div>\u003c/details>\n  \u003cdetails class=\"mas\">\u003csummary>Qué necesitas\u003c/summary>\u003cdiv class=\"in\">\n    \u003cp>Un \u003cb>A3 apaisado\u003c/b>, lápiz, goma, \u003cb>regla\u003c/b>, \u003cb>escuadra\u003c/b>, \u003cb>compás\u003c/b> y una \u003cb>regla flexible\u003c/b>. Todo a \u003cb>tamaño real\u003c/b> (1:1).\u003c/p>\n  \u003c/div>\u003c/details>\n  \u003cdiv class=\"nextscr first\">\u003cbutton class=\"btn gobtn\" type=\"button\" data-des=\"0\">Empezar a dibujar →\u003c/button>\u003c/div>\n\u003c/section>\n\n\u003c!-- ============ 2 · DIBÚJALO ============ -->\n\u003csection id=\"paso\" class=\"scr\" style=\"--c:var(--molten)\">\n  \u003ch2>Dibújalo paso a paso\u003c/h2>\n  \u003cdiv class=\"en10\">Pulsa \u003cb>▶\u003c/b>: un gesto cada vez. Hazlo tú en un A3, a \u003cb>tamaño real\u003c/b>.\u003c/div>\n  \u003cdiv class=\"dsel\" id=\"stSel\" role=\"group\" aria-label=\"Elige el desarrollo\">\u003c/div>\n  \u003cdiv class=\"stepper\" id=\"stp\">\n    \u003cdiv class=\"stage\">\n      \u003csvg class=\"td\" id=\"stSvg\" viewBox=\"0 0 400 300\" role=\"img\" aria-labelledby=\"stT\">\u003ctitle id=\"stT\">Animación: el compás y el lápiz dibujan el desarrollo paso a paso.\u003c/title>\u003c/svg>\n      \u003cdiv class=\"rotulo\" id=\"stRotBox\">\u003cbutton type=\"button\" class=\"rarrow\" id=\"stBack\" aria-label=\"Atrás: deshacer el último gesto\">◀\u003c/button>\u003cdiv class=\"rtxt\" id=\"stRot\" aria-live=\"polite\">\u003c/div>\u003cbutton type=\"button\" class=\"rarrow next hint\" id=\"stNext\" aria-label=\"Siguiente gesto\">▶\u003c/button>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"scrub\">\n      \u003cinput type=\"range\" id=\"stBar\" min=\"0\" max=\"1000\" value=\"0\" aria-label=\"Avance de la animación\">\n      \u003cdiv class=\"ticks\" id=\"stTicks\" aria-label=\"Pasos\">\u003c/div>\n    \u003c/div>\n    \u003cdetails class=\"mas txt\">\u003csummary>Ver este paso por escrito\u003c/summary>\u003cdiv id=\"stTxt\">\u003c/div>\u003c/details>\n  \u003c/div>\n  \u003cdetails class=\"mas\">\u003csummary>Saber más: el espesor y la costura\u003c/summary>\u003cdiv class=\"in\">\n    \u003cp>\u003cb>El espesor:\u003c/b> los diámetros del dibujo son los de la \u003cb>línea media\u003c/b> de la chapa. Cono de Ø100 por fuera y chapa de 2 mm: dibuja Ø98.\u003c/p>\n    \u003cp>\u003cb>La costura\u003c/b> va en una generatriz: en el cono recto, donde quieras; en el cortado, en la \u003cb>más corta\u003c/b>.\u003c/p>\n  \u003c/div>\u003c/details>\n  \u003cp class=\"rec1\">\u003cb>Recuerda:\u003c/b> primero el vértice · dos arcos desde él · el paso de la base, 12 veces.\u003c/p>\n  \u003cdiv class=\"nextscr\">\u003cbutton class=\"btn ghost\" type=\"button\" data-go=\"inicio\">← Las piezas\u003c/button>\u003cbutton class=\"btn\" type=\"button\" data-go=\"entender\">Siguiente: Entiéndelo →\u003c/button>\u003c/div>\n\u003c/section>\n\n\u003c!-- ============ 3 · ENTIÉNDELO ============ -->\n\u003csection id=\"entender\" class=\"scr\">\n  \u003ch2>Para entender lo que has hecho\u003c/h2>\n  \u003cdiv class=\"en10\">Un cono abierto es un \u003cb>abanico\u003c/b> (un sector de círculo). Su centro es el \u003cb>vértice\u003c/b> y su radio, la \u003cb>generatriz\u003c/b>: la línea de la punta a la base. Es el método de \u003cb>radiación\u003c/b>: todo sale del vértice.\u003c/div>\n  \u003col class=\"plain3\">\n    \u003cli>\u003cb>Busca el vértice.\u003c/b> Prolonga los lados hasta que se crucen.\u003c/li>\n    \u003cli>\u003cb>Abre el abanico.\u003c/b> Dos arcos desde el vértice: la base y la boca.\u003c/li>\n    \u003cli>\u003cb>Mide la base.\u003c/b> El arco grande mide lo que la base: 3,14 × D, en 12 pasos.\u003c/li>\n  \u003c/ol>\n  \u003cp class=\"soft\">Es como el cucurucho de un helado: lo abres por una línea y queda un abanico de papel.\u003c/p>\n  \u003cdetails class=\"mas\">\u003csummary>Saber más: ¿por qué hay que llevar las medidas al contorno?\u003c/summary>\u003cdiv class=\"in\">\n    \u003cp>En el cono cortado, cada generatriz mide distinto, pero en el alzado casi todas se ven \u003cb>inclinadas hacia ti\u003c/b>, más cortas de lo que son.\u003c/p>\n    \u003cp>Solo las dos del \u003cb>contorno\u003c/b> se ven enteras. Por eso cada punto del corte se lleva en \u003cb>horizontal\u003c/b> hasta el contorno: a la misma altura, la distancia hasta el vértice es la misma. Allí se mide con el compás.\u003c/p>\n  \u003c/div>\u003c/details>\n  \u003cdetails class=\"mas\">\u003csummary>Saber más: palabras del taller\u003c/summary>\u003cdiv class=\"in\">\n    \u003cdl class=\"plaindl\">\n      \u003cdt>Vértice\u003c/dt>\u003cdd>La punta del cono. Si la pieza es un tronco, hay que buscarlo prolongando los lados.\u003c/dd>\n      \u003cdt>Generatriz\u003c/dt>\u003cdd>Cada línea recta que va del vértice a la base.\u003c/dd>\n      \u003cdt>Tronco de cono (virola troncocónica)\u003c/dt>\u003cdd>Un cono al que le han cortado la punta. Se usa en reducciones, tolvas y embudos.\u003c/dd>\n      \u003cdt>Sector\u003c/dt>\u003cdd>El trozo de círculo entre dos radios: la forma de la plantilla.\u003c/dd>\n    \u003c/dl>\n  \u003c/div>\u003c/details>\n  \u003cp class=\"rec1\">\u003cb>Recuerda:\u003c/b> el cono abierto es un abanico · centro en el vértice · radio, la generatriz.\u003c/p>\n  \u003cdiv class=\"nextscr\">\u003cbutton class=\"btn ghost\" type=\"button\" data-go=\"paso\">← Dibújalo\u003c/button>\u003cbutton class=\"btn\" type=\"button\" data-go=\"comprueba\">Siguiente: Comprueba →\u003c/button>\u003c/div>\n\u003c/section>\n\n\u003c!-- ============ 4 · COMPRUEBA ============ -->\n\u003csection id=\"comprueba\" class=\"scr\" style=\"--c:var(--arc)\">\n  \u003ch2>Comprueba tus medidas\u003c/h2>\n  \u003cdiv class=\"en10\">Tronco de cono recto o cortado: mete tus medidas y \u003cb>compara\u003c/b> con tu plantilla.\u003c/div>\n  \u003cdiv class=\"dcards\" id=\"calcCards\">\n    \u003cbutton type=\"button\" class=\"dcard\" data-calc=\"0\">\u003csvg class=\"td\" id=\"cic0\" viewBox=\"0 0 10 10\" aria-hidden=\"true\">\u003c/svg>\u003cb>Tronco de cono recto\u003c/b>\u003cspan>Vértice, ángulo y abanico\u003c/span>\u003c/button>\n    \u003cbutton type=\"button\" class=\"dcard\" data-calc=\"1\">\u003csvg class=\"td\" id=\"cic1\" viewBox=\"0 0 10 10\" aria-hidden=\"true\">\u003c/svg>\u003cb>Cono cortado oblicuo\u003c/b>\u003cspan>Medidas reales y plantilla de la boca inclinada\u003c/span>\u003c/button>\n  \u003c/div>\n  \u003cbutton type=\"button\" class=\"volverc\" id=\"calcBack\" hidden>← Elegir otra calculadora\u003c/button>\n  \u003cdiv class=\"calcp\" data-calc=\"0\" hidden>\n  \u003cdiv class=\"calc\">\n    \u003ch3>Tronco de cono recto\u003c/h3>\n    \u003cdiv class=\"row\">\n      \u003clabel>Ø de abajo (mm)\u003cinput id=\"cD\" type=\"number\" min=\"10\" step=\"1\" value=\"100\" inputmode=\"numeric\">\u003c/label>\n      \u003clabel>Ø de arriba (mm)\u003cinput id=\"cd\" type=\"number\" min=\"0\" step=\"1\" value=\"50\" inputmode=\"numeric\">\u003c/label>\n      \u003clabel>Altura (mm)\u003cinput id=\"cH\" type=\"number\" min=\"1\" step=\"1\" value=\"60\" inputmode=\"numeric\">\u003c/label>\n    \u003c/div>\n    \u003cdiv class=\"out ok\" id=\"cOut\">\u003c/div>\n  \u003c/div>\n  \u003cdetails class=\"mas\">\u003csummary>Saber más: cómo calcula la calculadora\u003c/summary>\u003cdiv class=\"in\">\n    \u003cp>Altura hasta el vértice: \u003cb>altura × R ÷ (R − r)\u003c/b>. Generatriz grande: √(R² + altura hasta el vértice²) (Pitágoras). La pequeña: la grande × r ÷ R.\u003c/p>\n    \u003cp>Ángulo del abanico: \u003cb>360 × R ÷ generatriz grande\u003c/b>. Cálculo propio.\u003c/p>\n  \u003c/div>\u003c/details>\n  \u003c/div>\n  \u003cdiv class=\"calcp\" data-calc=\"1\" hidden>\n  \u003cdiv class=\"calc\">\n    \u003ch3>Cono cortado oblicuo\u003c/h3>\n    \u003cdiv class=\"row\">\n      \u003clabel>Ø de la base (mm)\u003cinput id=\"oD\" type=\"number\" min=\"10\" step=\"1\" value=\"100\" inputmode=\"numeric\">\u003c/label>\n      \u003clabel>Altura del vértice (mm)\u003cinput id=\"oV\" type=\"number\" min=\"1\" step=\"1\" value=\"120\" inputmode=\"numeric\">\u003c/label>\n      \u003clabel>Corte, lado corto (mm)\u003cinput id=\"oL\" type=\"number\" min=\"0\" step=\"1\" value=\"30\" inputmode=\"numeric\">\u003c/label>\n      \u003clabel>Corte, lado largo (mm)\u003cinput id=\"oR\" type=\"number\" min=\"0\" step=\"1\" value=\"60\" inputmode=\"numeric\">\u003c/label>\n    \u003c/div>\n    \u003cdiv class=\"out ok\" id=\"oOut\">\u003c/div>\n  \u003c/div>\n  \u003cp class=\"muted small\">Cálculo propio. En cada radio está la medida desde V': la que llevas con el compás. Las alturas del corte se miden en los dos lados del contorno, desde la base.\u003c/p>\n  \u003c/div>\n  \u003cdetails class=\"mas\">\u003csummary>Antes de dar por buena la plantilla\u003c/summary>\u003cdiv class=\"in\">\n  \u003cul class=\"check\" id=\"chk\">\n    \u003cli>\u003clabel>\u003cinput type=\"checkbox\">\u003cspan>Los lados prolongados se cortan en \u003cb>un punto\u003c/b>: el vértice.\u003c/span>\u003c/label>\u003c/li>\n    \u003cli>\u003clabel>\u003cinput type=\"checkbox\">\u003cspan>Los dos arcos tienen el \u003cb>mismo centro\u003c/b>.\u003c/span>\u003c/label>\u003c/li>\n    \u003cli>\u003clabel>\u003cinput type=\"checkbox\">\u003cspan>El paso se lleva \u003cb>12 veces\u003c/b> y el último cae en el borde.\u003c/span>\u003c/label>\u003c/li>\n    \u003cli>\u003clabel>\u003cinput type=\"checkbox\">\u003cspan>El ángulo del abanico es el de la calculadora (±1°).\u003c/span>\u003c/label>\u003c/li>\n    \u003cli>\u003clabel>\u003cinput type=\"checkbox\">\u003cspan>En el cortado, cada medida se tomó \u003cb>en el contorno\u003c/b>.\u003c/span>\u003c/label>\u003c/li>\n  \u003c/ul>\n  \u003c/div>\u003c/details>\n  \u003cp class=\"rec1\">\u003cb>Recuerda:\u003c/b> si el último paso no cae en el borde, repasa el paso antes de seguir.\u003c/p>\n  \u003cdiv class=\"nextscr\">\u003cbutton class=\"btn ghost\" type=\"button\" data-go=\"entender\">← Entiéndelo\u003c/button>\u003cbutton class=\"btn\" type=\"button\" data-go=\"ideas\">Siguiente: Test →\u003c/button>\u003c/div>\n\u003c/section>\n\n\u003c!-- ============ 5 · TEST ============ -->\n\u003csection id=\"ideas\" class=\"scr\">\n  \u003ch2>Test\u003c/h2>\n  \u003cdiv class=\"en10\">8 preguntas. Si fallas, lee la explicación y sigue.\u003c/div>\n  \u003cdetails class=\"mas\">\u003csummary>Repasa antes del test: 8 ideas clave\u003c/summary>\u003cdiv class=\"in\">\n    \u003col class=\"keys\">\n      \u003cli>Un cono abierto es un \u003cb>abanico\u003c/b> con centro en el vértice.\u003c/li>\n      \u003cli>El \u003cb>vértice\u003c/b> se busca prolongando los lados.\u003c/li>\n      \u003cli>El radio grande es la \u003cb>generatriz\u003c/b> hasta la base; el pequeño, hasta la boca.\u003c/li>\n      \u003cli>El arco grande mide \u003cb>3,14 × D\u003c/b> de la base.\u003c/li>\n      \u003cli>Ese arco se divide con el \u003cb>paso\u003c/b> (3,14 × D ÷ 12), sin cerrar el compás.\u003c/li>\n      \u003cli>Ángulo del abanico = \u003cb>360 × R ÷ generatriz\u003c/b>.\u003c/li>\n      \u003cli>En el cono cortado, cada medida se lleva en \u003cb>horizontal al contorno\u003c/b>.\u003c/li>\n      \u003cli>La curva del corte se une con la \u003cb>regla flexible\u003c/b>.\u003c/li>\n    \u003c/ol>\n  \u003c/div>\u003c/details>\n  \u003cdiv class=\"quiz\" id=\"quiz\">\u003c/div>\n  \u003cdiv class=\"nextscr\">\u003cbutton class=\"btn ghost\" type=\"button\" data-go=\"comprueba\">← Comprueba\u003c/button>\u003ca class=\"btn\" href=\"TRAZ_0_Portada.html\">Volver a los bloques ↺\u003c/a>\u003c/div>\n\u003c/section>\n\n\u003cfooter>\n  \u003cp style=\"margin:0 0 1rem\">\u003cb>Recurso elaborado por Xurxo.\u003c/b> Serie Trazado de desarrollos · Bloque 3 de 5.\u003c/p>\n  \u003cdetails>\n    \u003csummary>Fuentes y diferencias entre ellas\u003c/summary>\n    \u003cdiv class=\"in\">\n      \u003cp>\u003cb>Documentos del módulo\u003c/b>\u003c/p>\n      \u003cul>\n        \u003cli>\u003cb>Olave Villanueva, A. «Manual práctico de desarrollos de calderería». CEAC.\u003c/b> «Virola tronco-cónica de eje perpendicular a las bases» y «… base superior elíptica y no paralela a la inferior» (primera parte, págs. 24-27). «Diámetros exterior, interior y neutro» (pág. 14).\u003c/li>\n      \u003c/ul>\n      \u003cp>\u003cb>Diferencias detectadas\u003c/b>\u003c/p>\n      \u003cul>\n        \u003cli>\u003cb>Dividir la base.\u003c/b> El manual divide la planta de la base en 12. Aquí, en el tronco recto, el paso se calcula (3,14 × D ÷ 12) y se lleva con el compás; en el cortado se usa media circunferencia abatida, como en los cilindros.\u003c/li>\n        \u003cli>\u003cb>Paso en el arco.\u003c/b> Con el compás se lleva la cuerda, no el arco. Con un radio de 130 mm la diferencia es de 0,04 mm por paso: no se nota.\u003c/li>\n        \u003cli>\u003cb>Medidas.\u003c/b> El manual no da medidas. Las de los ejemplos son propias, pensadas para que todo quepa en un A3 a tamaño real.\u003c/li>\n      \u003c/ul>\n      \u003cp class=\"small\">El libro es una obra comercial: no se reproducen sus figuras. Todos los dibujos son propios.\u003c/p>\n    \u003c/div>\n  \u003c/details>\n\u003c/footer>\n\n\u003c/main>\n\n\u003cdiv class=\"lb\" id=\"lb\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Figura ampliada\">\n  \u003cdiv class=\"top\">\u003cspan>Desliza para moverte por la figura\u003c/span>\u003cbutton type=\"button\" id=\"lbClose\">Cerrar\u003c/button>\u003c/div>\n  \u003cdiv class=\"pan\">\u003cimg id=\"lbImg\" alt=\"\">\u003c/div>\n\u003c/div>\n\n\u003cscript>\nwindow.QUIZ=[\n  {q:\"¿Qué forma tiene un cono abierto y extendido?\",o:[\"Un rectángulo\",\"Un abanico (sector de círculo)\",\"Un triángulo\"],a:1,\n   e:\"Es un sector de círculo: centro en el vértice y radio, la generatriz.\"},\n  {q:\"Tienes un tronco de cono. ¿Cómo encuentras el vértice?\",o:[\"En el centro de la base\",\"Prolongando los dos lados hasta que se crucen\",\"A la mitad de la altura\"],a:1,\n   e:\"Los lados del tronco son generatrices: prolongadas, se juntan en la punta.\"},\n  {q:\"¿Qué radio tiene el arco grande de la plantilla?\",o:[\"El radio de la base\",\"La generatriz, del vértice a la base\",\"La altura del cono\"],a:1,\n   e:\"Los arcos se trazan desde el vértice con la generatriz: la grande para la base, la pequeña para la boca.\"},\n  {q:\"Base de Ø100. ¿Qué paso llevas con el compás sobre el arco grande?\",o:[\"8,3 mm\",\"26,2 mm\",\"50 mm\"],a:1,\n   e:\"3,14 × 100 ÷ 12 = 26,2 mm.\"},\n  {q:\"Base de Ø100 (R = 50) y generatriz de 130 mm. ¿Qué ángulo tiene el abanico?\",o:[\"Unos 90°\",\"138,5°\",\"180°\"],a:1,\n   e:\"360 × 50 ÷ 130 = 138,5°.\"},\n  {q:\"Tronco de Ø100 y Ø50 con 60 mm de alto. ¿A qué altura está el vértice?\",o:[\"60 mm\",\"120 mm\",\"180 mm\"],a:1,\n   e:\"Altura × R ÷ (R − r) = 60 × 50 ÷ 25 = 120 mm.\"},\n  {q:\"En el cono cortado, ¿por qué llevas cada punto del corte en horizontal hasta el contorno?\",o:[\"Para que quede bonito\",\"Porque en el contorno la generatriz se ve con su medida real\",\"Para dividir la base\"],a:1,\n   e:\"Las generatrices de dentro se ven acortadas. En el contorno se ven enteras: a la misma altura, la distancia al vértice es la misma.\"},\n  {q:\"El último paso del compás no cae en el borde de la plantilla. ¿Qué haces?\",o:[\"Lo dejas así\",\"Repasas el paso y vuelves a dividir\",\"Alargas el arco\"],a:1,\n   e:\"Si no cae justo, el paso está mal y la pieza no cerrará: hay que repasarlo.\"}\n];\n\u003c/script>\n\u003cscript>\n(function(){\n  \"use strict\";\n  var $=function(s,r){return (r||document).querySelector(s)};\n  var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};\n  window.$=$; window.$$=$$;\n\n  /* ---------- Barra de progreso y sección activa ---------- */\n  var bar=$(\"#bar\"), links=$$(\"#chips a\"), secs=links.map(function(a){return $(a.getAttribute(\"href\"))});\n  function onScroll(){\n    var h=document.documentElement, max=h.scrollHeight-h.clientHeight;\n    if(bar)bar.style.width=(max>0?Math.min(100,h.scrollTop/max*100):0)+\"%\";\n    var y=window.scrollY+140, cur=0;\n    secs.forEach(function(s,i){if(s&&s.getBoundingClientRect().top+window.scrollY\u003c=y)cur=i});\n    links.forEach(function(a,i){\n      var on=i===cur; a.classList.toggle(\"on\",on);\n      if(on)a.setAttribute(\"aria-current\",\"true\"); else a.removeAttribute(\"aria-current\");\n    });\n    var on=links[cur]; if(on&&on!==onScroll.last){\n      onScroll.last=on; var c=$(\"#chips\"); c.scrollTo({left:on.offsetLeft-c.clientWidth/2+on.clientWidth/2,behavior:\"smooth\"});\n    }\n  }\n  if(links.length){window.addEventListener(\"scroll\",onScroll,{passive:true});window.addEventListener(\"resize\",onScroll);onScroll();}\n\n  /* ---------- Ampliar figuras ---------- */\n  var lb=$(\"#lb\"), lbImg=$(\"#lbImg\");\n  function closeLb(){lb.classList.remove(\"open\");lbImg.removeAttribute(\"src\")}\n  document.addEventListener(\"click\",function(e){\n    var box=e.target.closest&&e.target.closest(\".zoomable\");\n    if(box&&lb){var im=$(\"img\",box);lbImg.src=im.src;lbImg.alt=im.alt;lb.classList.add(\"open\");$(\"#lbClose\").focus()}\n  });\n  if(lb){$(\"#lbClose\").addEventListener(\"click\",closeLb);\n  document.addEventListener(\"keydown\",function(e){if(e.key===\"Escape\")closeLb()});}\n\n  /* ---------- Pestañas genéricas ----------\n     tabs(contenedorBotones, panel, items, pintar)  items: [{t:\"Título\", c:\"var(--arc)\"}...] */\n  window.tabs=function(bar,panel,items,paint){\n    bar.setAttribute(\"role\",\"tablist\");\n    items.forEach(function(it,i){\n      var b=document.createElement(\"button\");b.type=\"button\";b.setAttribute(\"role\",\"tab\");b.textContent=it.t;\n      if(it.c)b.style.setProperty(\"--c\",it.c);\n      b.onclick=function(){sel(i)};bar.appendChild(b);\n    });\n    function sel(i){\n      $$(\"button\",bar).forEach(function(b,j){b.setAttribute(\"aria-selected\",j===i?\"true\":\"false\")});\n      if(items[i].c)panel.style.setProperty(\"--c\",items[i].c);\n      paint(items[i],i);\n    }\n    sel(0);return sel;\n  };\n\n  /* ---------- Comprueba lo que has aprendido ----------\n     window.QUIZ=[{q, o:[...], a:índice, e:\"explicación\", fig:\"id de una \u003cimg> de la página (opcional)\"}] */\n  var quiz=$(\"#quiz\");\n  if(quiz&&window.QUIZ){\n    var Q=window.QUIZ, qi=0, score=0, done=false;\n    var render=function(){\n      if(qi>=Q.length){\n        var msg=score===Q.length?\"¡Perfecto! Lo tienes dominado.\":score>=Q.length*0.75?\"Muy bien. Repasa lo que has fallado y lo tendrás.\":score>=Q.length/2?\"Vas bien, pero repasa las secciones de las preguntas falladas.\":\"Vuelve a leer el bloque con calma y repite el test.\";\n        quiz.innerHTML='\u003cp class=\"q\">Has acertado '+score+' de '+Q.length+'.\u003c/p>\u003cdiv class=\"meter\" aria-hidden=\"true\">\u003cspan style=\"width:'+Math.round(score/Q.length*100)+'%\">\u003c/span>\u003c/div>\u003cp>'+msg+'\u003c/p>\u003cbutton class=\"btn\" type=\"button\" id=\"qr\">Repetir\u003c/button>';\n        $(\"#qr\").onclick=function(){qi=0;score=0;render()};return;\n      }\n      var q=Q[qi];done=false;\n      var fig=\"\";\n      if(q.fig){var src=$(\"#\"+q.fig);if(src)fig='\u003cdiv class=\"qfig\">'+(src.tagName===\"IMG\"?'\u003cimg alt=\"\" src=\"'+src.getAttribute(\"src\")+'\">':src.outerHTML.replace(/^(\u003c[^>]*?)\\sid=\"[^\"]*\"/,\"$1\"))+'\u003c/div>';}\n      if(q.svg)fig='\u003cdiv class=\"qfig\">'+q.svg+'\u003c/div>';\n      quiz.innerHTML='\u003cdiv class=\"q\">'+(qi+1)+'. '+q.q+'\u003c/div>'+fig+'\u003cdiv class=\"opts\">\u003c/div>\u003cdiv class=\"fb\" hidden>\u003c/div>\u003cdiv class=\"nav\">\u003cspan>'+(qi+1)+' de '+Q.length+'\u003c/span>\u003cbutton class=\"btn\" type=\"button\" id=\"qn\" hidden>'+(qi===Q.length-1?\"Ver resultado\":\"Siguiente\")+'\u003c/button>\u003c/div>';\n      var box=$(\".opts\",quiz);\n      q.o.forEach(function(t,i){\n        var b=document.createElement(\"button\");b.type=\"button\";b.textContent=t;\n        b.onclick=function(){\n          if(done)return;done=true;\n          var ok=i===q.a;if(ok)score++;\n          $$(\"button\",box).forEach(function(x,j){x.disabled=true;if(j===q.a)x.classList.add(\"ok\");else if(j===i)x.classList.add(\"no\")});\n          var fb=$(\".fb\",quiz);fb.hidden=false;fb.innerHTML='\u003cb>'+(ok?\"¡Correcto!\":\"No es esa.\")+'\u003c/b> '+q.e;\n          $(\"#qn\").hidden=false;$(\"#qn\").onclick=function(){qi++;render();quiz.scrollIntoView({block:\"nearest\"})};\n        };\n        box.appendChild(b);\n      });\n    };\n    render();\n  }\n})();\n\n\u003c/script>\n\u003cscript>\n/* ===== Motor de los desarrollos de TRAZADO =====\n   Dibujo con compás y regla, gesto a gesto, con rótulos, barra de avance y pantallas con pestañas.\n   Cada página define sus pasos y llama a TRAZ.mount({...}). Ver TRAZ_4_Transiciones.html como ejemplo.\n   Unidades del dibujo: 2,5 unidades = 1 mm real (las piezas se dibujan a tamaño real en un A3). */\nwindow.TRAZ=(function(){\n  \"use strict\";\n  var T={};\n  function f(n){return Math.round(n*10)/10}\n  function dist(p,q){return Math.hypot(p[0]-q[0],p[1]-q[1])}\n  /* cruce de dos circunferencias (centro p radio r1, centro q radio r2): el punto más lejano de \"lejos\" */\n  function X(p,r1,q,r2,lejos){\n    var dx=q[0]-p[0],dy=q[1]-p[1],d=Math.hypot(dx,dy),a=(r1*r1-r2*r2+d*d)/(2*d),h=Math.sqrt(Math.max(0,r1*r1-a*a));\n    var mx=p[0]+a*dx/d,my=p[1]+a*dy/d,s1=[mx+h*dy/d,my-h*dx/d],s2=[mx-h*dy/d,my+h*dx/d];\n    return dist(s1,lejos)>dist(s2,lejos)?s1:s2;\n  }\n  function mm(n){return (Math.round(n*10)/10).toString().replace(\".\",\",\")}\n  /* elementos dibujables: polilínea con sus puntos; si lleva centro, se dibuja con el compás */\n  function D(pts,cls,c,lab){\n    return '\u003cpath class=\"'+cls+' dr\" d=\"M'+pts.map(function(p){return f(p[0])+\" \"+f(p[1])}).join(\"L\")+'\" data-p=\"'+pts.map(function(p){return f(p[0])+\",\"+f(p[1])}).join(\" \")+'\"'+(c?' data-c=\"'+f(c[0])+\",\"+f(c[1])+'\"':'')+(lab?' data-l=\"'+lab+'\"':'')+'/>';\n  }\n  function L(p,q,c){return D([p,q],c)}\n  function arcPts(c,r,a0,a1){var n=Math.max(10,Math.ceil(Math.abs(a1-a0)*r/5)),o=[];for(var i=0;i\u003c=n;i++){var a=a0+(a1-a0)*i/n;o.push([c[0]+r*Math.cos(a),c[1]+r*Math.sin(a)])}return o}\n  function ARC(c,r,ang,da,lab,cl){return D(arcPts(c,r,ang-da,ang+da),cl||\"cmp\",c,lab)}\n  function ARCAT(c,r,p,span,lab){var a=Math.atan2(p[1]-c[1],p[0]-c[0]);return ARC(c,r,a,(span||22)/r,lab).replace(\"/>\",' data-tp=\"'+f(p[0])+\",\"+f(p[1])+'\"/>')}\n  function CIRC(c,r,cl,lab){return D(arcPts(c,r,-Math.PI/2,1.5*Math.PI),cl,c,lab)}\n  /* arco de compás de a0 a a1 (radianes), por ejemplo una semicircunferencia */\n  function ARCFROM(c,r,a0,a1,cl,lab){return D(arcPts(c,r,a0,a1),cl||\"pz\",c,lab)}\n  function CURV(pts){ // curva suave (Catmull-Rom) muestreada: la de la regla flexible\n    var o=[pts[0]];\n    for(var i=0;i\u003cpts.length-1;i++){var p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;\n      var c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];\n      for(var k=1;k\u003c=12;k++){var t=k/12,u=1-t;o.push([u*u*u*p1[0]+3*u*u*t*c1[0]+3*u*t*t*c2[0]+t*t*t*p2[0],u*u*u*p1[1]+3*u*u*t*c1[1]+3*u*t*t*c2[1]+t*t*t*p2[1]])}}\n    return o;\n  }\n  function dot(p,r){return '\u003ccircle class=\"pt\" cx=\"'+f(p[0])+'\" cy=\"'+f(p[1])+'\" r=\"'+(r||4)+'\"/>'}\n  function tx(p,s,dx,dy,c,an){return '\u003ctext x=\"'+f(p[0]+(dx||0))+'\" y=\"'+f(p[1]+(dy||0))+'\"'+(c?' class=\"'+c+'\"':'')+' text-anchor=\"'+(an||\"middle\")+'\">'+s+ en)}\n.ticks{position:absolute;left:1.95rem;right:1.95rem;bottom:.35rem;height:1.5rem}\n.ticks button{position:absolute;transform:translateX(-50%);min-height:0;width:1.45rem;height:1.45rem;padding:0;border-radius:50%;border:0;background:var(--steel-soft);color:var(--ink2);font:700 .78rem \"Atkinson Hyperlegible\",sans-serif;cursor:pointer}\n.ticks button[aria-current=\"step\"]{background:var(--molten);color:#fff}\n.stepper .ctrl{justify-content:center!important;gap:.8rem!important}\n\n.rotulo .sub{display:block;font-size:.92rem;font-weight:400;margin-top:.2rem;opacity:.95}\n.speed{display:inline-flex;align-items:center;gap:.25rem;flex-wrap:wrap}.speed span{font-size:.9rem;color:var(--ink2);margin-right:.2rem}\n.speed button{font:inherit;font-size:.9rem;padding:.3rem .7rem;border-radius:99px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;min-height:2.2rem}\n.speed button[aria-pressed=\"true\"]{background:var(--molten);border-color:var(--molten);color:#fff}\n.ctrl2{border-top:0!important;padding:.15rem .6rem .35rem!important;justify-content:center!important;flex-wrap:wrap;gap:.45rem!important;font-size:.92rem}\n.ctrl2 .btn{min-height:2.2rem;padding:.25rem .8rem;font-size:.9rem}\n.speed button{min-height:2rem!important;padding:.2rem .6rem!important;font-size:.85rem!important}\n.stepper details.mas{margin:0 .9rem .6rem;border:0;background:none}\n.stepper details.mas>summary{padding:.15rem 0;font-size:.92rem;min-height:0}\n.stepper details.mas{margin-bottom:.3rem!important}\n@media (max-width:760px){\n  #paso>h2,#paso>.en10{display:none}\n  #paso.scr{padding-top:0}\n  #paso .stepper{margin:0 -1.1rem 1rem;border-radius:0;border-left:0;border-right:0;border-top:0}\n}\nol.acts{padding-left:1.4rem}ol.acts li{margin:.25rem 0}ol.acts li.on{font-weight:700;color:var(--molten)}ol.acts li.done{color:var(--ink2)}\n.td .fill{fill:var(--steel-soft);stroke:none}\n.td .tool path{fill:none;stroke-linecap:round;vector-effect:non-scaling-stroke}\n. E\");\n}\n.en10::after,.recuerda h4::before,.quiz::before,.calc::before,.pick::before,.check::before,.todo::before,.terms h4::before,.words h4::before,.ext>.tag::before{-webkit-mask:var(--ic) no-repeat center/contain;mask:var(--ic) no-repeat center/contain}\n\n/* =============== NIVEL 2 · ESTRUCTURA (pareja que abre y cierra) =============== */\n/* EN 10 SEGUNDOS: fondo azulado suave, barra marino y cronómetro */\n.en10{position:relative;margin:1.1rem 0 1.3rem;padding:.85rem 1.1rem .95rem 3.9rem;border-radius:12px;background:var(--n-soft);border-left:6px solid var(--n);color:var(--ink);font-size:1.1rem;line-height:1.45;box-shadow:none}\n.en10::before{content:\"EN 10 SEGUNDOS\";display:block;font:700 .9rem \"Barlow Condensed\",sans-serif;letter-spacing:.14em;color:var(--n);opacity:1;margin-bottom:.15rem}\n.en10::after{--ic:var(--i-reloj);content:\"\";position:absolute;left:1rem;top:.95rem;width:1.9rem;height:1.9rem;background:var(--n)}\n.en10 b{color:var(--ink);text-decoration:underline;text-decoration-color:var(--n);text-decoration-thickness:2px;text-underline-offset:3px}\n\n/* LO QUE TIENES QUE RECORDAR: siempre marino, borde y marcapáginas */\n.recuerda{--c:var(--n);margin:1.4rem 0 .4rem;padding:.75rem 1rem .85rem;border:2px solid var(--n);border-radius:12px;background:var(--card)}\n.recuerda h4{display:flex;align-items:center;gap:.45rem;margin:0 0 .35rem;font:700 1rem \"Barlow Condensed\",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--n)}\n.recuerda h4::before{--ic:var(--i-marca);content:\"\";flex:none;width:1.15rem;height:1.15rem;background:var(--n)}\n.recuerda ul{margin:.1rem 0 0;padding-left:1.2rem}\n.recuerda li{margin:.3rem 0}\n.recuerda li::marker{color:var(--n)}\n\n/* =============== NIVEL 1 · PARA HACER ALGO =============== */\n/* TEST: morado, solo se usa aquí */\n.quiz{margin:1.4rem 0;padding:0 1.1rem 1.2rem;border:2px solid var(--t);border-radius:16px;background:var(--card);overflow:hidden}\n.quiz::before{--ic:var(--i-test);content:\"\";position:absolute;width:1.35rem;height:1.35rem;margin:.72rem 0 0 -.15rem;background:var(--t-on)}\n.quiz{position:relative}\n.quiz>:first-child{margin-top:0}\n.quiz{background-image:linear-gradient(var(--t),var(--t));background-repeat:no-repeat;background-size:100% 2.8rem;padding-top:3.7rem}\n.quiz::after{content:\"Test · Comprueba lo que sabes\";position:absolute;left:2.9rem;top:.62rem;color:var(--t-on);font:700 1.1rem \"Barlow Condensed\",sans-serif;letter-spacing:.1em;text-transform:uppercase}\n.quiz .q{font-weight:700;font-size:1.12rem;margin:.2rem 0 .9rem}\n.quiz .opts{display:grid;gap:.55rem;counter-reset:op}\n.quiz .opts button{display:flex;align-items:center;gap:.75rem;font:inherit;text-align:left;padding:.6rem .9rem .6rem .6rem;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;min-height:3rem;transition:border-color .15s}\n.quiz .opts button::before{counter-increment:op;content:counter(op,upper-alpha);flex:none;display:grid;place-items:center;width:2rem;height:2rem;border-radius:50%;background:var(--t-soft);color:var(--t);font:700 1.05rem \"Barlow Condensed\",sans-serif}\n.quiz .opts button:hover:not(:disabled){border-color:var(--t)}\n.quiz .opts button.ok{border-color:var(--gas);background:var(--gas-soft)}\n.quiz .opts button.ok::before{content:\"✓\";background:var(--gas);color:#fff}\n.quiz .opts button.no{border-color:#C0262D;background:#FDE4E4}\n.quiz .opts button.no::before{content:\"✗\";background:#C0262D;color:#fff}\n:root[data-theme=\"dark\"] .quiz .opts button.no{background:#3A1214}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]) .quiz .opts button.no{background:#3A1214}}\n.quiz .fb{margin:.9rem 0 0;padding:.75rem .95rem;border-radius:12px;background:var(--t-soft);border-left:5px solid var(--t)}\n.quiz .nav{display:flex;justify-content:space-between;align-items:center;margin-top:1rem;gap:.6rem}\n.quiz .nav span{font:700 .95rem \"Barlow Condensed\",sans-serif;letter-spacing:.06em;color:var(--t);background:var(--t-soft);padding:.2rem .7rem;border-radius:99px}\n.quiz .btn{background:var(--t);color:var(--t-on)}\n.quiz .meter span{background:var(--t)}\n\n/* CALCULADORA: aparato oscuro, teclas y pantalla ámbar */\n.calc,.pick{position:relative;margin:1.5rem 0 1.3rem;padding:3.3rem 1rem 1rem;border:0;border-radius:18px;background:var(--s-body);color:#E8EEF5;box-shadow:0 6px 0 #0F1824,inset 0 1px 0 rgba(255,255,255,.08);overflow:hidden;\n  background-image:linear-gradient(var(--s-head),var(--s-head));background-repeat:no-repeat;background-size:100% 2.5rem}\n.calc::before,.pick::before{--ic:var(--i-calc);content:\"\";position:absolute;left:.95rem;top:.62rem;width:1.25rem;height:1.25rem;background:var(--s-amber)}\n.calc::after,.pick::after{content:\"Calculadora\";position:absolute;left:2.75rem;top:.55rem;color:var(--s-amber);font:700 .98rem \"Barlow Condensed\",sans-serif;letter-spacing:.16em;text-transform:uppercase}\n.calc h3{color:#fff}\n.calc label{color:#C9D6E3}\n.calc label b,.calc label strong{color:var(--s-amber)}\n.calc input[type=number],.calc select,.calc input[type=text]{font:inherit;font-size:1.15rem;font-weight:700;padding:.55rem .75rem;border:0;border-radius:10px;background:var(--s-key);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}\n.calc select option{color:#141C28;background:#fff}\n.calc input:focus-visible,.calc select:focus-visible,.calc button:focus-visible,.pick button:focus-visible{outline:3px solid var(--s-amber);outline-offset:2px}\n.calc input[type=range]{accent-color:var(--s-amber)}\n.calc button,.pick button{font:inherit;font-weight:700;color:#fff;background:var(--s-key);border:0;border-radius:10px;padding:.55rem .85rem;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35);cursor:pointer}\n.calc button[aria-pressed=\"true\"],.calc button[aria-selected=\"true\"],.pick button[aria-pressed=\"true\"]{background:var(--s-amber);color:#1E2A38}\n.pick button small{color:#C9D6E3}.pick button[aria-pressed=\"true\"] small{color:#4A3520}\n.calc svg{border-radius:12px;background:var(--card);padding:.3rem;margin-top:.7rem}\n.calc .out,.pick+.result{margin:.9rem 0 0;padding:.8rem 1rem;border:0;border-radius:12px;background:var(--s-lcd);color:var(--s-lcd-ink);font-family:ui-monospace,\"Cascadia Mono\",Consolas,monospace;font-size:.98rem;box-shadow:inset 0 2px 10px rgba(0,0,0,.7)}\n.calc .out b,.pick+.result b,.pick+.result dt{color:var(--s-lcd-hi)}\n.calc .out.ok{background:var(--s-lcd)}\n.calc .out.bad{background:#2E1410;color:#FFB4A0}\n.calc .out.bad b{color:#FFE0D6}\n.calc .out b.big{font:700 2rem ui-monospace,Consolas,monospace;color:var(--s-lcd-hi)}\n.calc .out .small,.calc .out .muted{color:#D9A863}\n.calc .facts div{background:var(--s-key);color:#C9D6E3;border-radius:10px}\n.calc .facts b{color:var(--s-amber)}\n.calc .muted{color:#9FB3C8}\n.pick{display:grid;gap:.5rem;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));margin-bottom:0;border-radius:18px 18px 0 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}\n.pick button{text-align:left;min-height:3rem}\n.pick+.result{margin:0 0 1.3rem;border:1rem solid var(--s-body);border-top:0;border-radius:0 0 18px 18px;box-shadow:0 6px 0 #0F1824;padding:.9rem 1rem}\n.pick+.result h3{color:var(--s-lcd-hi);font-family:\"Barlow Condensed\",sans-serif}\n.pick+.result dd{color:var(--s-lcd-ink)}\n.pick+.result .warn{color:#FFB4A0}\n\n/* =============== NIVEL 3 · APOYO (discretos) =============== */\n.check,.todo{list-style:none;margin:1.2rem 0;padding:.7rem .9rem .9rem;display:grid;gap:.45rem;border:1.5px solid var(--line);border-left:6px solid var(--gas);border-radius:0 12px 12px 0;background:var(--card);position:relative}\n.check::before,.todo::before{--ic:var(--i-lista);content:\"\";position:absolute;left:.9rem;top:.78rem;width:1.1rem;height:1.1rem;background:var(--gas)}\n.check::after,.todo::after{content:\"Lista de comprobación · márcala antes de empezar\";order:-1;grid-row:1;padding-left:1.6rem;font:700 .95rem \"Barlow Condensed\",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--gas)}\n.check label,.todo label{display:flex;gap:.75rem;align-items:flex-start;padding:.6rem .8rem;border:1px solid var(--line);border-radius:10px;background:var(--paper);cursor:pointer}\n.check input,.todo input{flex:none;width:1.45rem;height:1.45rem;margin:.05rem 0 0;accent-color:var(--gas)}\n.check label:has(input:checked),.todo label:has(input:checked){background:var(--gas-soft);border-color:var(--gas)}\n\n.terms,.words{margin:1.3rem 0;padding:.6rem 1rem .8rem;border:1px solid var(--line);border-left:6px solid var(--steel);border-radius:0 12px 12px 0;background:var(--card)}\n.terms h4,.words h4{display:flex;align-items:center;gap:.45rem;margin:0 0 .2rem;font:700 .95rem \"Barlow Condensed\",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--steel)}\n.terms h4::before,.words h4::before{--ic:var(--i-libro);content:\"\";flex:none;width:1.05rem;height:1.05rem;background:var(--steel)}\n.terms dt,.words dt{font-weight:700;margin-top:.5rem;color:var(--ink)}\n.terms dd,.words dd{margin:0;color:var(--ink2)}\n\n.ext{margin:1.4rem 0;padding:.1rem 1rem 1rem;border:1.5px dashed var(--steel);border-radius:12px;background:var(--card)}\n.ext>.tag{display:inline-flex;align-items:center;gap:.4rem;margin:.75rem 0 .15rem;padding:0;background:none;color:var(--steel);font:700 .9rem \"Barlow Condensed\",sans-serif;letter-spacing:.1em;text-transform:uppercase}\n.ext>.tag::before{--ic:var(--i-mundo);content:\"\";flex:none;width:1rem;height:1rem;background:var(--steel)}\n\n/* calculadoras de varios pasos: todo dentro de un mismo aparato (.calc) */\n.calc .pick{margin:.3rem 0 .7rem;padding:0;border-radius:0;background:none;box-shadow:none;overflow:visible}\n.calc .pick::before,.calc .pick::after{content:none}\n.calc .result,.calc .diag,.calc .pick+.result,.calc .tpanel{margin:.9rem 0 0;padding:.85rem 1rem;border:0;border-radius:12px;background:var(--s-lcd);color:var(--s-lcd-ink);box-shadow:inset 0 2px 10px rgba(0,0,0,.7)}\n.calc .result h3,.calc .diag h3,.calc .diag h4,.calc .result dt,.calc .diag b,.calc .result b,.calc .tpanel dt,.calc .tpanel b{color:var(--s-lcd-hi)}\n.calc .result dd,.calc .tpanel dd,.calc .diag li,.calc .diag p{color:var(--s-lcd-ink)}\n.calc .diag a,.calc .result a{color:var(--s-amber)}\n.calc .result .warn{color:#FFB4A0}\n.calc .big-num,.calc .out .big-num{color:var(--s-lcd-hi)}\n/* tablas dentro de una calculadora: se leen como una hoja sobre el aparato */\n.calc .scroll,.calc table{color:var(--ink)}\n.calc .scroll td,.calc .scroll th{color:var(--ink)}\n.calc .scroll td:first-child{color:var(--ink)}\n.calc input[type=search]{font:inherit;font-size:1.1rem;padding:.55rem .75rem;border:0;border-radius:10px;background:var(--s-key);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35);width:100%}\n.calc input::placeholder{color:#9FB3C8}\n/* filas de resultado dentro de una calculadora (Corte: procesos y condiciones A-E) */\n.calc .res li,.calc .conds li{background:var(--s-key);border-color:transparent;color:#E8EEF5}\n.calc .res li b,.calc .conds li b{color:#fff}\n.calc .res li.si{border-left:6px solid #3DDC84}.calc .res li.si .r{color:#8CF5B5}\n.calc .res li.no{border-left:6px solid #FF6B5B;opacity:.75}.calc .res li.no .r{color:#FFB4A0}\n.calc .conds li.ok{border-left-color:#3DDC84}\n.calc .conds li.ko{background:#3A1214;border-left-color:#FF6B5B}\n.calc .mbtn button{color:#fff;background:var(--s-key);border:0}\n.calc .mbtn button[aria-pressed=\"true\"]{background:var(--s-amber);color:#1E2A38}\n\n\u003c/style>\n\u003cstyle>\n/* TRAZADO: primera impresión ligera, pocas cajas */\nsection{padding-block:2.2rem 1rem}\n.hero svg.bg{height:min(30vh,210px)}\n.hero h1{font-size:clamp(2rem,8vw,3.3rem)}\n.hero .ctx{margin-top:.35rem}\nsection.start{padding-top:1.1rem}\n.start .lead{text-align:center;margin:.4rem auto .2rem;max-width:32rem}\n.isofig{max-width:23rem;margin:.4rem auto .2rem}\n.isofig figcaption{text-align:center;margin-top:.3rem}\n.go{text-align:center;margin:1rem 0 1.2rem}\n.gobtn{display:inline-flex;align-items:center;text-decoration:none;font-size:1.15rem;padding:.85rem 1.7rem;background:var(--molten);color:#fff}\n.en10{background:none;border-left:4px solid var(--n);border-radius:0;padding:.05rem 0 .1rem 1rem;margin:.8rem 0 1.1rem;font-size:1.08rem}\n.en10::after{display:none}\n.en10::before{font-size:.8rem}\n.rec1{margin:1.3rem 0 .2rem;font-size:.98rem;color:var(--ink2);padding-top:.7rem;border-top:1px dashed var(--line)}\n.rec1>b:first-child{color:var(--n);text-transform:uppercase;letter-spacing:.1em;font:700 .92rem \"Barlow Condensed\",sans-serif;margin-right:.35rem}\n.plain3{padding-left:1.3rem;margin:1rem 0}.plain3 li{margin:.35rem 0}\n.soft{color:var(--ink2);font-style:italic}\n.plaindl{margin:0}.plaindl dt{font-weight:700;margin-top:.6rem}.plaindl dd{margin:0;color:var(--ink2)}\n.keys li{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0}\n.leg{font-size:.88rem;color:var(--ink2)}\n/* rótulos de las vistas y números de cota: letra fina, que no tape el dibujo */\n.td .tt{font:300 17px \"Barlow Condensed\",\"Arial Narrow\",sans-serif;letter-spacing:.12em;fill:var(--ink2);stroke-width:3px}\n.td .dimx{fill:none;stroke:var(--ink2);stroke-width:1;vector-effect:non-scaling-stroke}\n.td .arr{fill:var(--ink2);stroke:none}\n.td .tb.dimt{font:300 17px \"Barlow Condensed\",\"Arial Narrow\",sans-serif;letter-spacing:.04em;fill:var(--ink2);stroke-width:3px}\n/* pantallas con pestañas */\n[hidden]{display:none!important}\nsection.scr{border-top:0;padding-top:1.4rem}\n.tabbar{display:flex;justify-content:center;gap:.2rem;padding:.35rem .5rem .4rem}\n.tabbar button{flex:1;max-width:8.5rem;display:flex;flex-direction:column;align-items:center;gap:.15rem;background:none;border:0;border-radius:10px;padding:.3rem .15rem;font:inherit;color:var(--ink2);cursor:pointer;min-height:3.3rem}\n.tabbar button:hover{background:var(--paper)}\n.tabbar .n{width:1.65rem;height:1.65rem;border-radius:50%;display:grid;place-items:center;background:var(--steel-soft);color:var(--ink2);font:700 .95rem \"Barlow Condensed\",sans-serif}\n.tabbar .t{font-size:.8rem;font-weight:700;line-height:1.1;text-align:center}\n.tabbar button.seen .n{background:var(--gas);color:#fff}\n.tabbar button[aria-current=\"page\"]{color:var(--molten)}\n.tabbar button[aria-current=\"page\"] .n{background:var(--molten);color:#fff;transform:scale(1.12)}\n@media (max-width:760px){\n  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.08);padding:.3rem max(8px,env(safe-area-inset-right,0px)) calc(.3rem + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}\n  body{padding-bottom:calc(4.6rem + env(safe-area-inset-bottom,0px))}\n}\n.nextscr{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap;margin:1.8rem 0 .6rem}\n.start .nextscr{justify-content:center}.nextscr.first{margin:.9rem 0 1.2rem}\n.nextscr .btn{min-height:3rem}\n.hero .volver{color:#fff;text-decoration:none;font-weight:700}\n.tabhome{flex:.8;max-width:6rem;display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.3rem .15rem;border-radius:10px;text-decoration:none;color:var(--ink2);min-height:3.3rem;border-right:1px solid var(--line);margin-right:.15rem}\n.tabhome .n{width:1.65rem;height:1.65rem;border-radius:50%;display:grid;place-items:center;background:none;border:1.5px solid var(--ink2);font-size:1rem;line-height:1}\n.tabhome .t{font-size:.8rem;font-weight:700}\n.tabhome:hover{background:var(--paper)}\n.dcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:.7rem;margin:1rem 0 .4rem}\n.dcard{display:flex;flex-direction:column;align-items:center;gap:.2rem;padding:.6rem .5rem .8rem;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;text-align:center}\n.dcard:hover,.dcard:focus-visible{border-color:var(--molten)}\n.dcard svg{width:100%;height:7.5rem;border:0!important;background:none}\n.dcard b{font:700 1.1rem \"Barlow Condensed\",sans-serif}.dcard span{font-size:.85rem;color:var(--ink2)}\n.dsel{display:flex;gap:.4rem;flex-wrap:wrap;margin:.2rem 0 .6rem}\n.dsel button{font:inherit;font-size:.92rem;font-weight:700;padding:.35rem .8rem;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:2.3rem}\n.dsel button[aria-pressed=\"true\"]{background:var(--molten);border-color:var(--molten);color:#fff}\n.calc .kline{margin:0 0 .2rem;font-size:1rem;line-height:1.5}\n.calc .kcap{margin:.7rem 0 0;font-weight:700;font-size:.9rem}\n.calc .out svg{display:block;width:100%;height:auto}\n.volverc{display:inline-flex;align-items:center;gap:.3rem;font:inherit;font-weight:700;color:var(--arc);background:none;border:0;padding:.4rem 0;margin:0 0 .3rem;cursor:pointer;min-height:2.4rem}\n.volverc:hover{text-decoration:underline}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader class=\"topnav\" id=\"topnav\">\n  \u003cdiv class=\"bar\" id=\"bar\">\u003c/div>\n  \u003cnav class=\"tabbar\" id=\"tabbar\" aria-label=\"Pantallas\">\n    \u003ca class=\"tabhome\" href=\"TRAZ_0_Portada.html\" aria-label=\"Volver a la portada: los 5 bloques\">\u003cspan class=\"n\">⌂\u003c/span>\u003cspan class=\"t\">Bloques\u003c/span>\u003c/a>\n    \u003cbutton type=\"button\" data-s=\"inicio\">\u003cspan class=\"n\">1\u003c/span>\u003cspan class=\"t\">Piezas\u003c/span>\u003c/button>\n    \u003cbutton type=\"button\" data-s=\"paso\">\u003cspan class=\"n\">2\u003c/span>\u003cspan class=\"t\">Dibújalo\u003c/span>\u003c/button>\n    \u003cbutton type=\"button\" data-s=\"entender\">\u003cspan class=\"n\">3\u003c/span>\u003cspan class=\"t\">Entiéndelo\u003c/span>\u003c/button>\n    \u003cbutton type=\"button\" data-s=\"comprueba\">\u003cspan class=\"n\">4\u003c/span>\u003cspan class=\"t\">Comprueba\u003c/span>\u003c/button>\n    \u003cbutton type=\"button\" data-s=\"ideas\">\u003cspan class=\"n\">5\u003c/span>\u003cspan class=\"t\">Test\u003c/span>\u003c/button>\n  \u003c/nav>\n\u003c/header>\n\n\u003cdiv class=\"hero\" id=\"top\">\n  \u003csvg class=\"bg\" id=\"heroSvg\" viewBox=\"0 0 800 420\" preserveAspectRatio=\"xMidYMid slice\" aria-hidden=\"true\">\u003c/svg>\n  \u003cdiv class=\"txt wrap\">\n    \u003cp class=\"ctx\">\u003ca href=\"TRAZ_0_Portada.html\" class=\"volver\">← Trazado de desarrollos\u003c/a> · Bloque 4 de 5\u003c/p>\n    \u003ch1>Transiciones\u003c/h1>\n    \u003cp class=\"ctx\">Tolvas · Triangulación · Módulo 0091 · \u003cb>Autor: Xurxo\u003c/b>\u003c/p>\n  \u003c/div>\n\u003c/div>\n\n\u003cmain class=\"wrap\">\n\n\u003c!-- ============ 1 · LA PIEZA ============ -->\n\u003csection id=\"inicio\" class=\"scr start\">\n  \u003cp class=\"lead\">Tolvas que cambian de forma: abajo una boca, arriba otra. Se trazan por \u003cb>triangulación\u003c/b>, con \u003cb>compás y regla\u003c/b>, gesto a gesto.\u003c/p>\n  \u003cdiv class=\"dcards\">\n    \u003cbutton type=\"button\" class=\"dcard\" data-des=\"0\">\u003csvg id=\"isoSvg\" class=\"td\" viewBox=\"0 0 10 10\" aria-hidden=\"true\">\u003c/svg>\u003cb>Cuadrado a redondo\u003c/b>\u003cspan>120 · Ø60 · 80 de alto\u003c/span>\u003c/button>\n    \u003cbutton type=\"button\" class=\"dcard\" data-des=\"1\">\u003csvg class=\"td\" id=\"iso1\" viewBox=\"0 0 10 10\" aria-hidden=\"true\">\u003c/svg>\u003cb>Rectángulo a redondo\u003c/b>\u003cspan>140 × 100 · Ø60 · 80 de alto\u003c/span>\u003c/button>\n    \u003cbutton type=\"button\" class=\"dcard\" data-des=\"2\">\u003csvg class=\"td\" id=\"iso2\" viewBox=\"0 0 10 10\" aria-hidden=\"true\">\u003c/svg>\u003cb>Cuadrado a cuadrado\u003c/b>\u003cspan>120 → 60 · 80 de alto\u003c/span>\u003c/button>\n  \u003c/div>\n  \u003cp class=\"muted small\" style=\"text-align:center\">Toca una pieza para dibujarla. En naranja, la media pieza que vas a trazar.\u003c/p>\n  \u003cdiv class=\"nextscr first\">\u003cbutton class=\"btn gobtn\" type=\"button\" data-des=\"0\">Empezar a dibujar →\u003c/button>\u003c/div>\n  \u003cdetails class=\"mas\">\u003csummary>Qué vas a aprender\u003c/summary>\u003cdiv class=\"in\">\n    \u003cul class=\"list\">\n      \u003cli>dibujar la pieza en \u003cb>alzado\u003c/b> (de frente) y \u003cb>planta\u003c/b> (desde arriba);\u003c/li>\n      \u003cli>dividir una circunferencia en \u003cb>12 partes\u003c/b> con el compás;\u003c/li>\n      \u003cli>partir la superficie en \u003cb>triángulos\u003c/b>;\u003c/li>\n      \u003cli>sacar la \u003cb>medida real\u003c/b> de cada línea;\u003c/li>\n      \u003cli>montar los triángulos en plano y obtener la \u003cb>plantilla\u003c/b>.\u003c/li>\n    \u003c/ul>\n  \u003c/div>\u003c/details>\n  \u003cdetails class=\"mas\">\u003csummary>Qué necesitas\u003c/summary>\u003cdiv class=\"in\">\n    \u003cp>Papel (mejor A3), lápiz, goma, \u003cb>regla\u003c/b>, \u003cb>escuadra\u003c/b> y \u003cb>compás\u003c/b>. Para la curva final, una \u003cb>regla flexible\u003c/b> (o una varilla fina que se doble). Dibuja a \u003cb>tamaño real\u003c/b> (escala 1:1) en un \u003cb>A3 apaisado\u003c/b>: la pieza está pensada para que todo quepa.\u003c/p>\n  \u003c/div>\u003c/details>\n\u003c/section>\n\n\u003c!-- ============ 2 · DIBÚJALO ============ -->\n\u003csection id=\"paso\" class=\"scr\" style=\"--c:var(--molten)\">\n  \u003ch2>Dibújalo paso a paso\u003c/h2>\n  \u003cdiv class=\"en10\">Pulsa \u003cb>▶\u003c/b>: un gesto cada vez. Hazlo tú en un A3, a \u003cb>tamaño real\u003c/b>.\u003c/div>\n  \u003cdiv class=\"dsel\" id=\"stSel\" role=\"group\" aria-label=\"Elige el desarrollo\">\u003c/div>\n  \u003cdiv class=\"stepper\" id=\"stp\">\n    \u003cdiv class=\"stage\">\n      \u003csvg class=\"td\" id=\"stSvg\" viewBox=\"0 0 400 300\" role=\"img\" aria-labelledby=\"stT\">\u003ctitle id=\"stT\">Animación: el compás y el lápiz dibujan el desarrollo paso a paso.\u003c/title>\u003c/svg>\n      \u003cdiv class=\"rotulo\" id=\"stRotBox\">\u003cbutton type=\"button\" class=\"rarrow\" id=\"stBack\" aria-label=\"Atrás: deshacer el último gesto\">◀\u003c/button>\u003cdiv class=\"rtxt\" id=\"stRot\" aria-live=\"polite\">\u003c/div>\u003cbutton type=\"button\" class=\"rarrow next hint\" id=\"stNext\" aria-label=\"Siguiente gesto\">▶\u003c/button>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"scrub\">\n      \u003cinput type=\"range\" id=\"stBar\" min=\"0\" max=\"1000\" value=\"0\" aria-label=\"Avance de la animación\">\n      \u003cdiv class=\"ticks\" id=\"stTicks\" aria-label=\"Pasos\">\u003c/div>\n    \u003c/div>\n    \u003cdetails class=\"mas txt\">\u003csummary>Ver este paso por escrito\u003c/summary>\u003cdiv id=\"stTxt\">\u003c/div>\u003c/details>\n  \u003c/div>\n  \u003cdetails class=\"mas\">\u003csummary>Saber más: los colores y el espesor de la chapa\u003c/summary>\u003cdiv class=\"in\">\n    \u003cdiv class=\"leg\">\n    \u003cspan>\u003ci style=\"background:var(--gas)\">\u003c/i>A-1, C-4, E-7\u003c/span>\n    \u003cspan>\u003ci style=\"background:var(--molten)\">\u003c/i>B-1, B-4, D-4, D-7\u003c/span>\n    \u003cspan>\u003ci style=\"background:#8A3FD1\">\u003c/i>B-2, B-3, D-5, D-6\u003c/span>\n    \u003cspan>\u003ci style=\"background:var(--arc);height:.2rem\">\u003c/i>arcos de compás\u003c/span>\n  \u003c/div>\n    \u003cp>\u003cb>Mismo color = misma medida real.\u003c/b> Por simetría solo hay 3 medidas distintas. El dibujo es propio, con las medidas del ejemplo a escala.\u003c/p>\n    \u003cp>\u003cb>¿Y el espesor?\u003c/b> Dibuja con las medidas de la \u003cb>línea media\u003c/b> de la chapa (el «diámetro neutro»). Si la boca es de Ø60 por dentro y la chapa es de 2 mm, dibuja la boca de Ø62. Así, al curvar, la pieza sale a medida.\u003c/p>\n  \u003c/div>\u003c/details>\n  \u003cp class=\"rec1\">\u003cb>Recuerda:\u003c/b> media pieza basta · cada punto nuevo sale de \u003cb>dos arcos\u003c/b> · paso de la boca = 3,14 × Ø ÷ 12.\u003c/p>\n  \u003cdiv class=\"nextscr\">\u003cbutton class=\"btn ghost\" type=\"button\" data-go=\"inicio\">← La pieza\u003c/button>\u003cbutton class=\"btn\" type=\"button\" data-go=\"entender\">Siguiente: Entiéndelo →\u003c/button>\u003c/div>\n\u003c/section>\n\n\u003c!-- ============ 3 · ENTIÉNDELO ============ -->\n\u003csection id=\"entender\" class=\"scr\">\n  \u003ch2>Para entender lo que has hecho\u003c/h2>\n  \u003cdiv class=\"en10\">Has hecho una \u003cb>triangulación\u003c/b>: partir la pieza en \u003cb>triángulos\u003c/b>, sacar la \u003cb>medida real\u003c/b> de sus lados y ponerlos en plano, uno al lado del otro.\u003c/div>\n  \u003col class=\"plain3\">\n    \u003cli>\u003cb>Divide.\u003c/b> Líneas de la boca de abajo a la de arriba.\u003c/li>\n    \u003cli>\u003cb>Mide de verdad.\u003c/b> En el dibujo las líneas salen más cortas.\u003c/li>\n    \u003cli>\u003cb>Monta.\u003c/b> Triángulo a triángulo, como un puzle.\u003c/li>\n  \u003c/ol>\n  \u003cp class=\"soft\">Es como forrar la pieza con triángulos de cartón, despegarlos y ponerlos en la mesa sin dejar huecos.\u003c/p>\n  \u003cdetails class=\"mas\">\u003csummary>Saber más: ¿por qué la planta engaña?\u003c/summary>\u003cdiv class=\"in\">\n    \u003cp>La planta es la pieza vista \u003cb>desde arriba\u003c/b>. Una línea que sube (de la base a la boca) se ve \u003cb>aplastada\u003c/b>: más corta de lo que es.\u003c/p>\n    \u003cp>Piensa en una escalera vista desde un dron: desde arriba parece cortísima, aunque tenga muchos peldaños. Para saber cuánto mide de verdad, hay que tener en cuenta \u003cb>lo que sube\u003c/b>: eso hace el triángulo de medidas reales (lo tumbado = la planta; lo de pie = la altura; la diagonal = la medida real).\u003c/p>\n  \u003c/div>\u003c/details>\n  \u003cdetails class=\"mas\">\u003csummary>Saber más: palabras del taller\u003c/summary>\u003cdiv class=\"in\">\n    \u003cdl class=\"plaindl\">\n      \u003cdt>Desarrollo o plantilla\u003c/dt>\u003cdd>La pieza abierta y extendida sobre la chapa, antes de curvarla y soldarla.\u003c/dd>\n      \u003cdt>Alzado y planta\u003c/dt>\u003cdd>La pieza vista de frente (alzado) y desde arriba (planta).\u003c/dd>\n      \u003cdt>Verdadera magnitud (VM)\u003c/dt>\u003cdd>Lo que mide \u003cb>de verdad\u003c/b> una línea. En el dibujo, una línea inclinada se ve más corta.\u003c/dd>\n      \u003cdt>Regla flexible o junquillo\u003c/dt>\u003cdd>Varilla que se dobla para unir puntos con una curva suave.\u003c/dd>\n    \u003c/dl>\n  \u003c/div>\u003c/details>\n  \u003cp class=\"rec1\">\u003cb>Recuerda:\u003c/b> triangular = partir en triángulos y montarlos en plano · cada lado, con su medida real.\u003c/p>\n  \u003cdiv class=\"nextscr\">\u003cbutton class=\"btn ghost\" type=\"button\" data-go=\"paso\">← Dibújalo\u003c/button>\u003cbutton class=\"btn\" type=\"button\" data-go=\"comprueba\">Siguiente: Comprueba →\u003c/button>\u003c/div>\n\u003c/section>\n\n\u003c!-- ============ 4 · COMPRUEBA ============ -->\n\u003csection id=\"comprueba\" class=\"scr\" style=\"--c:var(--arc)\">\n  \u003ch2>Comprueba tus medidas\u003c/h2>\n  \u003cdiv class=\"en10\">Mete tus medidas y \u003cb>compara\u003c/b> con tu dibujo. Si te sale parecido (±1 mm), vas bien.\u003c/div>\n  \u003cdiv class=\"dcards\" id=\"calcCards\">\n    \u003cbutton type=\"button\" class=\"dcard\" data-calc=\"0\">\u003csvg class=\"td\" id=\"cic0\" viewBox=\"0 0 10 10\" aria-hidden=\"true\">\u003c/svg>\u003cb>Cuadrado a redondo\u003c/b>\u003cspan>3 medidas reales y media plantilla\u003c/span>\u003c/button>\n    \u003cbutton type=\"button\" class=\"dcard\" data-calc=\"1\">\u003csvg class=\"td\" id=\"cic1\" viewBox=\"0 0 10 10\" aria-hidden=\"true\">\u003c/svg>\u003cb>Rectángulo a redondo\u003c/b>\u003cspan>6 medidas reales y media plantilla\u003c/span>\u003c/button>\n    \u003cbutton type=\"button\" class=\"dcard\" data-calc=\"2\">\u003csvg class=\"td\" id=\"cic2\" viewBox=\"0 0 10 10\" aria-hidden=\"true\">\u003c/svg>\u003cb>Cuadrado a cuadrado\u003c/b>\u003cspan>Arista, diagonal y media tolva\u003c/span>\u003c/button>\n  \u003c/div>\n  \u003cbutton type=\"button\" class=\"volverc\" id=\"calcBack\" hidden>← Elegir otra calculadora\u003c/button>\n  \u003cdiv class=\"calcp\" data-calc=\"0\" hidden>\n  \u003cdiv class=\"calc\">\n    \u003ch3>Tolva de cuadrado a redondo\u003c/h3>\n    \u003cdiv class=\"row\">\n      \u003clabel>Lado del cuadrado (mm)\u003cinput id=\"cL\" type=\"number\" min=\"50\" step=\"1\" value=\"120\" inputmode=\"numeric\">\u003c/label>\n      \u003clabel>Ø de la boca (mm)\u003cinput id=\"cD\" type=\"number\" min=\"10\" step=\"1\" value=\"60\" inputmode=\"numeric\">\u003c/label>\n      \u003clabel>Altura (mm)\u003cinput id=\"cH\" type=\"number\" min=\"10\" step=\"1\" value=\"80\" inputmode=\"numeric\">\u003c/label>\n    \u003c/div>\n    \u003cdiv class=\"out ok\" id=\"cOut\">\u003c/div>\n    \u003csvg id=\"cSvg\" viewBox=\"0 0 400 240\" role=\"img\" aria-label=\"Media plantilla con las medidas calculadas.\">\u003c/svg>\n  \u003c/div>\n  \u003cdetails class=\"mas\">\u003csummary>Saber más: cómo calcula la calculadora\u003c/summary>\u003cdiv class=\"in\">\n    \u003cp>Hace con números lo mismo que tú con el triángulo de medidas reales: el teorema de \u003cb>Pitágoras\u003c/b>.\u003c/p>\n    \u003cp>\u003cb>Medida real = √(planta² + altura²)\u003c/b>. Ejemplo, B-1: √(67,1² + 80²) = √(4 500 + 6 400) ≈ \u003cb>104,4 mm\u003c/b>.\u003c/p>\n    \u003cp>El paso de la boca es la circunferencia entre 12: 3,14 × 60 ÷ 12 = \u003cb>15,7 mm\u003c/b>. Cálculo propio.\u003c/p>\n  \u003c/div>\u003c/details>\n  \u003c/div>\n  \u003cdiv class=\"calcp\" data-calc=\"1\" hidden>\n  \u003cdiv class=\"calc\">\n    \u003ch3>Tolva de rectángulo a redondo\u003c/h3>\n    \u003cdiv class=\"row\">\n      \u003clabel>Largo (mm)\u003cinput id=\"rL\" type=\"number\" min=\"20\" step=\"1\" value=\"140\" inputmode=\"numeric\">\u003c/label>\n      \u003clabel>Ancho (mm)\u003cinput id=\"rA\" type=\"number\" min=\"20\" step=\"1\" value=\"100\" inputmode=\"numeric\">\u003c/label>\n      \u003clabel>Ø de la boca (mm)\u003cinput id=\"rD\" type=\"number\" min=\"10\" step=\"1\" value=\"60\" inputmode=\"numeric\">\u003c/label>\n      \u003clabel>Altura (mm)\u003cinput id=\"rH\" type=\"number\" min=\"10\" step=\"1\" value=\"80\" inputmode=\"numeric\">\u003c/label>\n    \u003c/div>\n    \u003cdiv class=\"out ok\" id=\"rOut\">\u003c/div>\n  \u003c/div>\n  \u003cp class=\"muted small\">Cálculo propio. Medidas reales en mm. B-C mide la mitad del ancho y A-B la mitad del largo.\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"calcp\" data-calc=\"2\" hidden>\n  \u003cdiv class=\"calc\">\n    \u003ch3>Tolva de cuadrado a cuadrado\u003c/h3>\n    \u003cdiv class=\"row\">\n      \u003clabel>Lado de abajo (mm)\u003cinput id=\"qA\" type=\"number\" min=\"20\" step=\"1\" value=\"120\" inputmode=\"numeric\">\u003c/label>\n      \u003clabel>Lado de arriba (mm)\u003cinput id=\"qB\" type=\"number\" min=\"1\" step=\"1\" value=\"60\" inputmode=\"numeric\">\u003c/label>\n      \u003clabel>Altura (mm)\u003cinput id=\"qH\" type=\"number\" min=\"1\" step=\"1\" value=\"80\" inputmode=\"numeric\">\u003c/label>\n    \u003c/div>\n    \u003cdiv class=\"out ok\" id=\"qOut\">\u003c/div>\n  \u003c/div>\n  \u003cp class=\"muted small\">Cálculo propio. Arista y diagonal de cada cara, con su medida real (Pitágoras con la altura).\u003c/p>\n  \u003c/div>\n  \u003ch3>Cuando lo pases a chapa, en el taller\u003c/h3>\n  \u003cul class=\"check\" id=\"chk\">\n    \u003cli>\u003clabel>\u003cinput type=\"checkbox\">\u003cspan>He dibujado con las medidas de la \u003cb>línea media\u003c/b> de la chapa.\u003c/span>\u003c/label>\u003c/li>\n    \u003cli>\u003clabel>\u003cinput type=\"checkbox\">\u003cspan>La boca está en \u003cb>12 partes iguales\u003c/b>.\u003c/span>\u003c/label>\u003c/li>\n    \u003cli>\u003clabel>\u003cinput type=\"checkbox\">\u003cspan>Cada línea va con su \u003cb>medida real\u003c/b>, no la de la planta.\u003c/span>\u003c/label>\u003c/li>\n    \u003cli>\u003clabel>\u003cinput type=\"checkbox\">\u003cspan>A-B, B-C, C-D y D-E miden \u003cb>media base\u003c/b>.\u003c/span>\u003c/label>\u003c/li>\n    \u003cli>\u003clabel>\u003cinput type=\"checkbox\">\u003cspan>La curva 1-7, con \u003cb>regla flexible\u003c/b> y sin picos.\u003c/span>\u003c/label>\u003c/li>\n    \u003cli>\u003clabel>\u003cinput type=\"checkbox\">\u003cspan>Marcadas las \u003cb>líneas de las esquinas\u003c/b> para curvar.\u003c/span>\u003c/label>\u003c/li>\n  \u003c/ul>\n  \u003cp class=\"rec1\">\u003cb>Recuerda:\u003c/b> la calculadora es para comprobar, no para saltarte el dibujo · mide dos veces, corta una.\u003c/p>\n  \u003cdiv class=\"nextscr\">\u003cbutton class=\"btn ghost\" type=\"button\" data-go=\"entender\">← Entiéndelo\u003c/button>\u003cbutton class=\"btn\" type=\"button\" data-go=\"ideas\">Siguiente: Test →\u003c/button>\u003c/div>\n\u003c/section>\n\n\u003c!-- ============ 5 · TEST ============ -->\n\u003csection id=\"ideas\" class=\"scr\">\n  \u003ch2>Test\u003c/h2>\n  \u003cdiv class=\"en10\">8 preguntas. Si fallas, lee la explicación y sigue.\u003c/div>\n  \u003cdetails class=\"mas\">\u003csummary>Repasa antes del test: 8 ideas clave\u003c/summary>\u003cdiv class=\"in\">\n    \u003col class=\"keys\">\n      \u003cli>Triangular = partir en \u003cb>triángulos\u003c/b>, sacar su \u003cb>medida real\u003c/b> y montarlos en plano.\u003c/li>\n      \u003cli>Primero \u003cb>alzado y planta\u003c/b>, a escala y alineados.\u003c/li>\n      \u003cli>La boca se divide en \u003cb>12\u003c/b> con el compás abierto al radio.\u003c/li>\n      \u003cli>Cada \u003cb>esquina\u003c/b> con sus 4 puntos de la boca; cada \u003cb>mitad de lado\u003c/b>, con su punto.\u003c/li>\n      \u003cli>En planta las líneas se ven \u003cb>más cortas\u003c/b>: la medida real sale del \u003cb>triángulo\u003c/b>.\u003c/li>\n      \u003cli>Por simetría, solo hay \u003cb>3 medidas reales\u003c/b> distintas.\u003c/li>\n      \u003cli>Cada punto de la plantilla sale de \u003cb>dos arcos\u003c/b>: la medida real y el paso de la boca.\u003c/li>\n      \u003cli>La curva, con \u003cb>regla flexible\u003c/b>. Media pieza × 2.\u003c/li>\n    \u003c/ol>\n  \u003c/div>\u003c/details>\n  \u003cdiv class=\"quiz\" id=\"quiz\">\u003c/div>\n  \u003cdiv class=\"nextscr\">\u003cbutton class=\"btn ghost\" type=\"button\" data-go=\"comprueba\">← Comprueba\u003c/button>\u003ca class=\"btn\" href=\"TRAZ_0_Portada.html\">Volver a los bloques ↺\u003c/a>\u003c/div>\n\u003c/section>\n\n\u003cfooter>\n  \u003cp style=\"margin:0 0 1rem\">\u003cb>Recurso elaborado por Xurxo.\u003c/b> Serie Trazado de desarrollos · Bloque 4 de 5.\u003c/p>\n  \u003cdetails>\n    \u003csummary>Fuentes y diferencias entre ellas\u003c/summary>\n    \u003cdiv class=\"in\">\n      \u003cp>\u003cb>Documentos del módulo\u003c/b>\u003c/p>\n      \u003cul>\n        \u003cli>\u003cb>Olave Villanueva, A. «Manual práctico de desarrollos de calderería». CEAC.\u003c/b> «Fundamento del método de triangulación» (págs. 112-113) y «Tolva de bases paralelas, la mayor cuadrada y la menor circular» (págs. 114-115). Trazados fundamentales (págs. 8-9): división de la circunferencia. «Diámetros exterior, interior y neutro» (pág. 14).\u003c/li>\n      \u003c/ul>\n      \u003cp>\u003cb>Diferencias detectadas\u003c/b>\u003c/p>\n      \u003cul>\n        \u003cli>\u003cb>Nombres de los puntos.\u003c/b> El manual usa letras para todo (a, b, c… y g, h, i… en la boca). Aquí se usan letras en el cuadrado (A-E) y números en la boca (1-7), y solo para media pieza: es más fácil de seguir.\u003c/li>\n        \u003cli>\u003cb>Paso entre puntos de la boca.\u003c/b> El manual lo toma de la planta «con regla flexible», es decir, la longitud del arco. Aquí se calcula (3,14 × Ø ÷ 12 = 15,7 mm) y se lleva con el compás. Si se tomara la cuerda recta con el compás saldría 15,5 mm: 0,2 mm menos por paso y unos 2 mm menos en toda la boca.\u003c/li>\n        \u003cli>\u003cb>Rectángulo a redondo y cuadrado a cuadrado.\u003c/b> Mismo método de triangulación del manual («Tolvas de bases paralelas»). En la tolva de caras planas se triangula cada cara con su diagonal; también se podría trazar por radiación desde el vértice de la pirámide.\u003c/li>\n        \u003cli>\u003cb>Medidas.\u003c/b> El manual no da medidas. Las del ejemplo (120, Ø60 y 80 mm) son propias, pensadas para que todo el trazado quepa en un A3 a tamaño real.\u003c/li>\n      \u003c/ul>\n      \u003cp class=\"small\">El libro es una obra comercial: no se reproducen sus figuras. Todos los dibujos son propios y se generan con las medidas reales del ejemplo.\u003c/p>\n    \u003c/div>\n  \u003c/details>\n\u003c/footer>\n\n\u003c/main>\n\n\u003cdiv class=\"lb\" id=\"lb\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Figura ampliada\">\n  \u003cdiv class=\"top\">\u003cspan>Desliza para moverte por la figura\u003c/span>\u003cbutton type=\"button\" id=\"lbClose\">Cerrar\u003c/button>\u003c/div>\n  \u003cdiv class=\"pan\">\u003cimg id=\"lbImg\" alt=\"\">\u003c/div>\n\u003c/div>\n\n\u003cscript>\nwindow.QUIZ=[\n  {q:\"¿Qué es la verdadera magnitud de una línea?\",o:[\"Lo que mide en la planta\",\"Lo que mide de verdad, sin el acortamiento del dibujo\",\"La línea más larga de la pieza\"],a:1,\n   e:\"Una línea inclinada se ve más corta en planta. La verdadera magnitud es su medida real, la que va a la chapa.\"},\n  {q:\"En planta, B-1 mide 67,1 mm. La tolva tiene 80 mm de altura. ¿Cuánto mide B-1 de verdad?\",o:[\"67,1 mm\",\"104,4 mm\",\"147,1 mm\"],a:1,\n   e:\"Triángulo rectángulo: 67,1 tumbado, 80 de pie. La diagonal mide 104,4 mm. No se suman: se hace el triángulo.\"},\n  {q:\"Abres el compás al radio de la boca y pinchas en los 4 cruces de los ejes. ¿En cuántas partes queda la circunferencia?\",o:[\"En 6\",\"En 8\",\"En 12\"],a:2,\n   e:\"Cada arco marca 2 puntos nuevos. Con los 4 de los ejes, 12 partes iguales de 30°.\"},\n  {q:\"Boca de Ø60 en 12 partes. ¿Qué paso llevas con el compás entre dos puntos seguidos del desarrollo?\",o:[\"5 mm\",\"15,7 mm\",\"30 mm\"],a:1,\n   e:\"3,14 × 60 ÷ 12 = 15,7 mm. Es la longitud de 1/12 de la boca.\"},\n  {q:\"Tolva de cuadrado a cuadrado. ¿Qué líneas de la planta ya tienen su medida real?\",o:[\"Las aristas\",\"Los lados de las dos bases, porque están planos\",\"Las diagonales de las caras\"],a:1,\n   e:\"Los lados de abajo y de arriba son horizontales: en la planta se ven enteros. Las aristas y las diagonales suben: hay que sacar su medida real.\"},\n  {q:\"¿Cómo sacas el punto 3 en el desarrollo?\",o:[\"Midiendo con la regla desde C\",\"Cruzando un arco desde B (VM de B-3) con otro desde 4 (paso de la boca)\",\"Copiándolo de la planta\"],a:1,\n   e:\"Cada punto nuevo sale del cruce de dos arcos: uno con la VM y otro con el paso de 15,7 mm.\"},\n  {q:\"En el cuadrado a redondo hay 3 medidas reales distintas. ¿Y en el rectángulo a redondo?\",o:[\"También 3\",\"6, porque las esquinas ya no están a la misma distancia de los puntos de la boca\",\"Solo 1\"],a:1,\n   e:\"Al ser rectángulo se pierde parte de la simetría: A-1, C-4, B-1, B-2, B-3 y B-4 miden distinto. D repite las de B.\"},\n  {q:\"¿Con qué unes los puntos 1 a 7 del desarrollo?\",o:[\"Con rectas, de punto a punto\",\"Con una regla flexible, en curva suave\",\"Con el compás, desde C\"],a:1,\n   e:\"La boca es redonda: los puntos se unen con una curva suave. Se usa una regla flexible o junquillo.\"}\n];\n\u003c/script>\n\u003cscript>\n(function(){\n  \"use strict\";\n  var $=function(s,r){return (r||document).querySelector(s)};\n  var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};\n  window.$=$; window.$$=$$;\n\n  /* ---------- Barra de progreso y sección activa ---------- */\n  var bar=$(\"#bar\"), links=$$(\"#chips a\"), secs=links.map(function(a){return $(a.getAttribute(\"href\"))});\n  function onScroll(){\n    var h=document.documentElement, max=h.scrollHeight-h.clientHeight;\n    if(bar)bar.style.width=(max>0?Math.min(100,h.scrollTop/max*100):0)+\"%\";\n    var y=window.scrollY+140, cur=0;\n    secs.forEach(function(s,i){if(s&&s.getBoundingClientRect().top+window.scrollY\u003c=y)cur=i});\n    links.forEach(function(a,i){\n      var on=i===cur; a.classList.toggle(\"on\",on);\n      if(on)a.setAttribute(\"aria-current\",\"true\"); else a.removeAttribute(\"aria-current\");\n    });\n    var on=links[cur]; if(on&&on!==onScroll.last){\n      onScroll.last=on; var c=$(\"#chips\"); c.scrollTo({left:on.offsetLeft-c.clientWidth/2+on.clientWidth/2,behavior:\"smooth\"});\n    }\n  }\n  if(links.length){window.addEventListener(\"scroll\",onScroll,{passive:true});window.addEventListener(\"resize\",onScroll);onScroll();}\n\n  /* ---------- Ampliar figuras ---------- */\n  var lb=$(\"#lb\"), lbImg=$(\"#lbImg\");\n  function closeLb(){lb.classList.remove(\"open\");lbImg.removeAttribute(\"src\")}\n  document.addEventListener(\"click\",function(e){\n    var box=e.target.closest&&e.target.closest(\".zoomable\");\n    if(box&&lb){var im=$(\"img\",box);lbImg.src=im.src;lbImg.alt=im.alt;lb.classList.add(\"open\");$(\"#lbClose\").focus()}\n  });\n  if(lb){$(\"#lbClose\").addEventListener(\"click\",closeLb);\n  document.addEventListener(\"keydown\",function(e){if(e.key===\"Escape\")closeLb()});}\n\n  /* ---------- Pestañas genéricas ----------\n     tabs(contenedorBotones, panel, items, pintar)  items: [{t:\"Título\", c:\"var(--arc)\"}...] */\n  window.tabs=function(bar,panel,items,paint){\n    bar.setAttribute(\"role\",\"tablist\");\n    items.forEach(function(it,i){\n      var b=document.createElement(\"button\");b.type=\"button\";b.setAttribute(\"role\",\"tab\");b.textContent=it.t;\n      if(it.c)b.style.setProperty(\"--c\",it.c);\n      b.onclick=function(){sel(i)};bar.appendChild(b);\n    });\n    function sel(i){\n      $$(\"button\",bar).forEach(function(b,j){b.setAttribute(\"aria-selected\",j===i?\"true\":\"false\")});\n      if(items[i].c)panel.style.setProperty(\"--c\",items[i].c);\n      paint(items[i],i);\n    }\n    sel(0);return sel;\n  };\n\n  /* ---------- Comprueba lo que has aprendido ----------\n     window.QUIZ=[{q, o:[...], a:índice, e:\"explicación\", fig:\"id de una \u003cimg> de la página (opcional)\"}] */\n  var quiz=$(\"#quiz\");\n  if(quiz&&window.QUIZ){\n    var Q=window.QUIZ, qi=0, score=0, done=false;\n    var render=function(){\n      if(qi>=Q.length){\n        var msg=score===Q.length?\"¡Perfecto! Lo tienes dominado.\":score>=Q.length*0.75?\"Muy bien. Repasa lo que has fallado y lo tendrás.\":score>=Q.length/2?\"Vas bien, pero repasa las secciones de las preguntas falladas.\":\"Vuelve a leer el bloque con calma y repite el test.\";\n        quiz.innerHTML='\u003cp class=\"q\">Has acertado '+score+' de '+Q.length+'.\u003c/p>\u003cdiv class=\"meter\" aria-hidden=\"true\">\u003cspan style=\"width:'+Math.round(score/Q.length*100)+'%\">\u003c/span>\u003c/div>\u003cp>'+msg+'\u003c/p>\u003cbutton class=\"btn\" type=\"button\" id=\"qr\">Repetir\u003c/button>';\n        $(\"#qr\").onclick=function(){qi=0;score=0;render()};return;\n      }\n      var q=Q[qi];done=false;\n      var fig=\"\";\n      if(q.fig){var src=$(\"#\"+q.fig);if(src)fig='\u003cdiv class=\"qfig\">'+(src.tagName===\"IMG\"?'\u003cimg alt=\"\" src=\"'+src.getAttribute(\"src\")+'\">':src.outerHTML.replace(/^(\u003c[^>]*?)\\sid=\"[^\"]*\"/,\"$1\"))+'\u003c/div>';}\n      if(q.svg)fig='\u003cdiv class=\"qfig\">'+q.svg+'\u003c/div>';\n      quiz.innerHTML='\u003cdiv class=\"q\">'+(qi+1)+'. '+q.q+'\u003c/div>'+fig+'\u003cdiv class=\"opts\">\u003c/div>\u003cdiv class=\"fb\" hidden>\u003c/div>\u003cdiv class=\"nav\">\u003cspan>'+(qi+1)+' de '+Q.length+'\u003c/span>\u003cbutton class=\"btn\" type=\"button\" id=\"qn\" hidden>'+(qi===Q.length-1?\"Ver resultado\":\"Siguiente\")+'\u003c/button>\u003c/div>';\n      var box=$(\".opts\",quiz);\n      q.o.forEach(function(t,i){\n        var b=document.createElement(\"button\");b.type=\"button\";b.textContent=t;\n        b.onclick=function(){\n          if(done)return;done=true;\n          var ok=i===q.a;if(ok)score++;\n          $$(\"button\",box).forEach(function(x,j){x.disabled=true;if(j===q.a)x.classList.add(\"ok\");else if(j===i)x.classList.add(\"no\")});\n          var fb=$(\".fb\",quiz);fb.hidden=false;fb.innerHTML='\u003cb>'+(ok?\"¡Correcto!\":\"No es esa.\")+'\u003c/b> '+q.e;\n          $(\"#qn\").hidden=false;$(\"#qn\").onclick=function(){qi++;render();quiz.scrollIntoView({block:\"nearest\"})};\n        };\n        box.appendChild(b);\n      });\n    };\n    render();\n  }\n})();\n\n\u003c/script>\n\u003cscript>\n/* ===== Motor de los desarrollos de TRAZADO =====\n   Dibujo con compás y regla, gesto a gesto, con rótulos, barra de avance y pantallas con pestañas.\n   Cada página define sus pasos y llama a TRAZ.mount({...}). Ver TRAZ_4_Transiciones.html como ejemplo.\n   Unidades del dibujo: 2,5 unidades = 1 mm real (las piezas se dibujan a tamaño real en un A3). */\nwindow.TRAZ=(function(){\n  \"use strict\";\n  var T={};\n  function f(n){return Math.round(n*10)/10}\n  function dist(p,q){return Math.hypot(p[0]-q[0],p[1]-q[1])}\n  /* cruce de dos circunferencias (centro p radio r1, centro q radio r2): el punto más lejano de \"lejos\" */\n  function X(p,r1,q,r2,lejos){\n    var dx=q[0]-p[0],dy=q[1]-p[1],d=Math.hypot(dx,dy),a=(r1*r1-r2*r2+d*d)/(2*d),h=Math.sqrt(Math.max(0,r1*r1-a*a));\n    var mx=p[0]+a*dx/d,my=p[1]+a*dy/d,s1=[mx+h*dy/d,my-h*dx/d],s2=[mx-h*dy/d,my+h*dx/d];\n    return dist(s1,lejos)>dist(s2,lejos)?s1:s2;\n  }\n  function mm(n){return (Math.round(n*10)/10).toString().replace(\".\",\",\")}\n  /* elementos dibujables: polilínea con sus puntos; si lleva centro, se dibuja con el compás */\n  function D(pts,cls,c,lab){\n    return '\u003cpath class=\"'+cls+' dr\" d=\"M'+pts.map(function(p){return f(p[0])+\" \"+f(p[1])}).join(\"L\")+'\" data-p=\"'+pts.map(function(p){return f(p[0])+\",\"+f(p[1])}).join(\" \")+'\"'+(c?' data-c=\"'+f(c[0])+\",\"+f(c[1])+'\"':'')+(lab?' data-l=\"'+lab+'\"':'')+'/>';\n  }\n  function L(p,q,c){return D([p,q],c)}\n  function arc
